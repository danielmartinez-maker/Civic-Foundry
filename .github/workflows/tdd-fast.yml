name: Civic Foundry TDD Fast

on:
  pull_request:

permissions:
  contents: read

jobs:
  node-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Node 22
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Install project dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Node tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Format contracts
        run: npm run format:check
      - name: Asset source policy
        run: npm run assets:policy
      - name: Check deterministic 3D sources
        run: npm run assets:3d:check
      - name: Install build rasterizer
        run: |
          python -m pip install playwright==1.55.0 Pillow==11.3.0
          python -m playwright install chromium
      - name: Build local ESM runtime
        run: npm run build
      - name: Verify Babylon vendor paths
        run: |
          test -f dist/vendor/@babylonjs/core/Engines/webgpuEngine.js
          test -f dist/vendor/@babylonjs/loaders/glTF/index.js
      - name: Verify House A runtime outputs
        run: |
          test -s dist/assets/models/cf_bld_res_detached_house_a_low_v01_lod0.glb
          test -s dist/assets/models/cf_bld_res_detached_house_a_low_v01_lod1.glb
          test -s dist/assets/models/cf_bld_res_detached_house_a_low_v01_lod2.glb
          test -s dist/assets/collisions/cf_bld_res_detached_house_a_low_v01_collision.glb
          test -s dist/assets/manifests/cf_bld_res_detached_house_a_low_v01_manifest.json
          test -s dist/assets/manifests/catalog-v2.json
