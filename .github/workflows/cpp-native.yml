name: C++ Native Migration Gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  native-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install native toolchain
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang
      - name: Bootstrap vcpkg
        shell: bash
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg "$RUNNER_TEMP/vcpkg"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"
      - name: Configure Clang C++23
        run: cmake -S cpp -B cpp/build -G Ninja -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" -DCIVIC_BUILD_TESTS=ON
      - name: Build native engine tests
        run: cmake --build cpp/build --parallel 2
      - name: Run CTest
        run: ctest --test-dir cpp/build --output-on-failure

  native-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg "$env:RUNNER_TEMP/vcpkg"
          & "$env:RUNNER_TEMP/vcpkg/bootstrap-vcpkg.bat" -disableMetrics
          "VCPKG_ROOT=$env:RUNNER_TEMP/vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Configure MSVC C++23
        shell: pwsh
        run: cmake -S cpp -B cpp/build -A x64 -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" -DCIVIC_BUILD_TESTS=ON
      - name: Build native engine tests
        run: cmake --build cpp/build --config Release --parallel 2
      - name: Run CTest
        run: ctest --test-dir cpp/build -C Release --output-on-failure
