name: Stack 3 Task 1 Patch

on:
  push:
    branches: [feature/stack-3-3d-presentation-asset-scaleup]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[stack3-task1-green]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: feature/stack-3-3d-presentation-asset-scaleup
          fetch-depth: 0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
      - name: Apply exact Task 1 patches
        run: node scripts/stack3-task1-green.mjs
      - name: Commit GREEN patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/3d/asset-source-schema.mjs tools/3d/CivicAssetCompiler.mjs src/rendering/3d/assets/AssetManifestV2.ts src/rendering/3d/assets/AssetManifestV2Validation.ts tests/asset_compiler.test.ts tests/asset_manifest_v2.test.ts assets/source/3d/buildings/cf_bld_res_detached_house_a_low_v01.asset.json
          git commit -m 'feat: add Stack 3 production asset metadata [stack3-task1-green]'
          git push origin HEAD:feature/stack-3-3d-presentation-asset-scaleup
