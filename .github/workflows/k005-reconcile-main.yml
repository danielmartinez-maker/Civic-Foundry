name: K005 reconcile current main

on:
  push:
    branches:
      - feature/k005-random-stream-registry-cpp

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Reconcile K005 with current main
        run: node scripts/cpp/k005-reconcile-main.mjs
