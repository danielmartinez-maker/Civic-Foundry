name: Stack 0 Verify Diagnostics

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify-diagnostics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Node 22
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Install project dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install verification runtime
        run: python -m pip install Pillow==11.3.0
      - name: Capture core verification diagnostics
        shell: bash
        run: |
          set +e
          npm run verify > verify.log 2>&1
          status=$?
          cat verify.log
          printf '%s\n' "$status" > verify-exit-code.txt
          exit 0
      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: stack0-verify-diagnostics
          path: |
            verify.log
            verify-exit-code.txt
          if-no-files-found: error
