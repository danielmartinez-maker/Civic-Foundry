name: Phase 7 Review Fix PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.head_ref == 'phase7-tenure-relocation' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase7-tenure-relocation
          fetch-depth: 0
      - name: Skip if review fix already applied
        id: guard
        shell: bash
        run: |
          if git log -1 --format=%s | grep -q '\[phase7-review-fix\]'; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Apply pre-merge review fixes
        if: steps.guard.outputs.skip != 'true'
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              return text.replace(old, new, 1)

          p = Path('src/simulation/housing/HousingRelocationSystem.ts')
          text = p.read_text()
          marker = '''function emptyCycle(): CycleMetrics {
            return {
              moved: 0,
              displaced: 0,
              rehoused: 0,
              failed: 0,
              movedInByBuilding: new Map(),
              movedOutByBuilding: new Map(),
              displacedByBuilding: new Map(),
            };
          }
'''
          replacement = marker + '''
          function cloneCycle(cycle: CycleMetrics): CycleMetrics {
            return {
              moved: cycle.moved,
              displaced: cycle.displaced,
              rehoused: cycle.rehoused,
              failed: cycle.failed,
              movedInByBuilding: new Map(cycle.movedInByBuilding),
              movedOutByBuilding: new Map(cycle.movedOutByBuilding),
              displacedByBuilding: new Map(cycle.displacedByBuilding),
            };
          }
'''
          text = replace_once(text, marker, replacement, 'cloneCycle insertion')
          text = replace_once(
              text,
              '  private pendingCycle = emptyCycle();\n',
              '  private pendingCycle = emptyCycle();\n  private latestCycle = emptyCycle();\n',
              'latestCycle field',
          )
          text = replace_once(
              text,
              '    this.pendingCycle = emptyCycle();\n    const cycle = emptyCycle();\n',
              '    this.pendingCycle = emptyCycle();\n    this.latestCycle = emptyCycle();\n    const cycle = emptyCycle();\n',
              'initialize cycle reset',
          )
          text = replace_once(
              text,
              '    this.latest = this.buildSnapshot(input.population, options, cycle);\n',
              '    this.latestCycle = cloneCycle(cycle);\n    this.latest = this.buildSnapshot(input.population, options, this.latestCycle);\n',
              'reconcile latest cycle',
          )
          text = replace_once(
              text,
              '    this.latest = this.buildSnapshot(population, validOptions, emptyCycle());\n',
              '    this.latest = this.buildSnapshot(population, validOptions, this.latestCycle);\n',
              'derived refresh cycle preservation',
          )
          text = replace_once(
              text,
              '    this.initialized = true;\n    this.pendingCycle = emptyCycle();\n    return this.snapshotState();\n',
              '    this.initialized = true;\n    this.pendingCycle = emptyCycle();\n    this.latestCycle = emptyCycle();\n    return this.snapshotState();\n',
              'restore cycle reset',
          )
          p.write_text(text)

          p = Path('src/simulation/core/SimulationCore.ts')
          text = p.read_text()
          text = replace_once(
              text,
              '''    this.refreshLandHousingMarket();
              this.refreshHousingTenure();
              this.housingRelocation.reconcile({ population: this.population.population, options: this.housingTenureSnapshot.options, allowVoluntaryMoves: true });
              this.refreshHousingChoice();
              this.demandSnapshot = this.demand.evaluate({''',
              '''    this.refreshLandHousingMarket();
              this.refreshHousingTenure();
              this.syncHousingPopulationWithoutVoluntaryMoves();
              this.refreshHousingChoice();
              this.demandSnapshot = this.demand.evaluate({''',
              'pre-population housing sync',
          )
          text = replace_once(
              text,
              '''    this.housingRelocation.reconcile({ population: this.population.population, options: this.housingTenureSnapshot.options, allowVoluntaryMoves: false });
              this.refreshHousingChoice();
              this.refreshRedevelopmentPressure();''',
              '''    this.housingRelocation.reconcile({ population: this.population.population, options: this.housingTenureSnapshot.options, allowVoluntaryMoves: true });
              this.refreshHousingChoice();
              this.refreshRedevelopmentPressure();''',
              'post-population voluntary reconcile',
          )
          p.write_text(text)

          p = Path('src/simulation/development/RedevelopmentExecutionSystem.ts')
          text = p.read_text()
          text = replace_once(
              text,
              '''      if (
                displacedLowerIncomeResidents > 0
                && Math.max(0, lowerIncomeAffordableSlack - reservedLowerIncomeSlack)
                  < displacedLowerIncomeResidents * lowerIncomeRelocationProtection
              ) {''',
              '''      const requiredLowerIncomeSlack = displacedLowerIncomeResidents * lowerIncomeRelocationProtection;
              if (
                displacedLowerIncomeResidents > 0
                && Math.max(0, lowerIncomeAffordableSlack - reservedLowerIncomeSlack) < requiredLowerIncomeSlack
              ) {''',
              'lower-income requirement',
          )
          text = replace_once(
              text,
              '      reservedLowerIncomeSlack += displacedLowerIncomeResidents;\n',
              '      reservedLowerIncomeSlack += requiredLowerIncomeSlack;\n',
              'lower-income cumulative reservation',
          )
          p.write_text(text)
      - name: Commit review fixes
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/simulation/housing/HousingRelocationSystem.ts src/simulation/core/SimulationCore.ts src/simulation/development/RedevelopmentExecutionSystem.ts
          git commit -m 'fix: preserve Phase 7 relocation semantics [phase7-review-fix]'
          git push origin HEAD:phase7-tenure-relocation
