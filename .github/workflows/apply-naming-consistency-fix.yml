name: Apply naming consistency fix

on:
  push:
    branches:
      - fix/naming-consistency-pass
    paths:
      - scripts/apply-naming-consistency-fix.mjs

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/naming-consistency-pass
          fetch-depth: 0
      - name: Apply bounded naming replacements
        run: node scripts/apply-naming-consistency-fix.mjs
      - name: Commit implementation
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/simulation/core/LegacySimulationCore.ts src/simulation/core/SimulationCore.ts tests/support/kernelParity.ts src/app/GameApp.ts src/ui/Inspector.ts
          git commit -m "fix: normalize naming inconsistencies"
          git push origin HEAD:fix/naming-consistency-pass
