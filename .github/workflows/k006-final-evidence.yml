name: K006 final evidence

on:
  push:
    branches:
      - feature/k006-simulation-kernel-cpp-rewrite

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          sudo apt-get update
          sudo apt-get install -y ninja-build libjson-c-dev libgtest-dev
      - name: Verify rewrite ledger and authority state
        run: |
          npm run cpp:ts-ledger:verify
          npm run cpp:authority:verify
      - name: Run exact K006 focused gate
        run: node scripts/cpp/run-native-round.mjs --regex "NativeKernelParity|NativeEngineContracts|CAbi"
      - name: Fetch matching Node headers
        run: |
          NODE_VERSION="$(node -p 'process.versions.node')"
          curl -fsSLo "$RUNNER_TEMP/node-headers.tar.gz" "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-headers.tar.gz"
          tar -xzf "$RUNNER_TEMP/node-headers.tar.gz" -C "$RUNNER_TEMP"
          echo "CIVIC_NODE_HEADERS=$RUNNER_TEMP/node-v${NODE_VERSION}/include/node" >> "$GITHUB_ENV"
      - name: Configure native bridge
        run: >-
          cmake -S cpp -B cpp/build-k006-evidence -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCIVIC_NODE_INCLUDE_DIR="$CIVIC_NODE_HEADERS"
          -DCIVIC_BUILD_TESTS=ON
          -DCIVIC_BUILD_NAPI=ON
      - name: Build native bridge
        run: cmake --build cpp/build-k006-evidence --parallel
      - name: Run shared migration corpus twice
        run: |
          node --experimental-strip-types tests/native-migration-parity.mjs cpp/build-k006-evidence/civic_native.node
          node --experimental-strip-types tests/native-migration-parity.mjs cpp/build-k006-evidence/civic_native.node
      - name: Generate K006 C005 evidence
        run: node --experimental-strip-types scripts/cpp/k006-generate-evidence.mjs cpp/build-k006-evidence/civic_native.node
      - name: Validate K006 C005 evidence
        run: |
          node scripts/cpp/parity-evidence.mjs test-artifacts/cpp-parity/K006/empty-new-city-kernel-step-transaction-tick-250.json
          node scripts/cpp/parity-evidence.mjs test-artifacts/cpp-parity/K006/non-kernel-gameplay-domains-unowned-tick-250.json
      - name: Upload K006 evidence
        uses: actions/upload-artifact@v6.0.0
        with:
          name: k006-final-evidence-${{ github.sha }}
          path: test-artifacts/cpp-parity/K006/*.json
          if-no-files-found: error
          retention-days: 30
