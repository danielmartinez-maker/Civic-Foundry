name: K002 reconcile K003 main

on:
  push:
    branches:
      - feature/k002-domain-event-journal-cpp
    paths:
      - .github/workflows/k002-sync-k003.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/k002-domain-event-journal-cpp
          fetch-depth: 0

      - name: Merge current main and layer K002 over K003
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          set +e
          git merge --no-ff --no-commit origin/main
          merge_status=$?
          set -e
          if [ "$merge_status" -ne 0 ]; then
            echo "Resolving expected K002/K003 overlap explicitly."
          fi

          git checkout origin/main -- cpp/engine/include/civic/core/Kernel.hpp
          git checkout origin/main -- cpp/engine/src/core/Kernel.cpp
          git checkout origin/main -- cpp/tests/core/CoreTests.cpp
          git checkout origin/main -- cpp/tests/parity/ParityTests.cpp
          git checkout origin/main -- docs/cpp/TS_REWRITE_LEDGER.json

          python3 scripts/cpp/k002-sync-k003-temp.py

          git add cpp/engine/include/civic/core/Kernel.hpp cpp/engine/src/core/Kernel.cpp cpp/engine/src/core/NativeEngine.cpp cpp/tests/core/CoreTests.cpp cpp/tests/parity/ParityTests.cpp docs/cpp/TS_REWRITE_LEDGER.json

          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "Unresolved conflicts remain:"
            git diff --name-only --diff-filter=U
            exit 1
          fi

          git diff --check --cached -- cpp/engine/include/civic/core/Kernel.hpp cpp/engine/src/core/Kernel.cpp cpp/engine/src/core/NativeEngine.cpp cpp/tests/core/CoreTests.cpp cpp/tests/parity/ParityTests.cpp docs/cpp/TS_REWRITE_LEDGER.json
          node scripts/cpp/ts-rewrite-ledger.mjs verify
          git commit -m "Merge main into K002 after K003"
          git push origin HEAD:feature/k002-domain-event-journal-cpp
