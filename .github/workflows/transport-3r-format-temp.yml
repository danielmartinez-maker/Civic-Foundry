name: Transport 3R temporary formatter

on:
  push:
    branches:
      - feature/stack-2-transportation-3r-completion

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[transport-format-done]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7.0.1
        with:
          ref: feature/stack-2-transportation-3r-completion
      - name: Node 22
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Apply repository formatter
        run: npm run format
      - name: Commit canonical formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/simulation/transportation tests
          git commit -m "style(transportation): canonicalize 3r intersection port [transport-format-done]"
          git push origin HEAD:feature/stack-2-transportation-3r-completion
