name: K005 ledger one-shot

on:
  push:
    branches:
      - feature/k005-random-stream-registry-cpp

permissions:
  contents: write

jobs:
  reconcile-ledger:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Update only CF-TS-0099 and remove helper
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'docs/cpp/TS_REWRITE_LEDGER.json';
          const ledger = JSON.parse(fs.readFileSync(path, 'utf8'));
          const entry = ledger.entries.find((candidate) => candidate.inventoryId === 'CF-TS-0099');
          if (!entry || entry.path !== 'src/simulation/kernel/RandomStreamRegistry.ts') {
            throw new Error('CF-TS-0099 RandomStreamRegistry ledger entry not found');
          }
          entry.assignedStack = 'K005';
          entry.targetNativeOwner = 'cpp/engine/src/core/RandomStreamRegistry.cpp';
          entry.nativeTestOwner = 'cpp/tests/parity/ParityTests.cpp';
          entry.status = 'parity_accepted';
          entry.currentAuthority = 'typescript';
          entry.parityClassification = 'parity';
          fs.writeFileSync(path, JSON.stringify(ledger, null, 2) + '\n');
          NODE
          rm .github/workflows/k005-ledger-one-shot.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/cpp/TS_REWRITE_LEDGER.json .github/workflows/k005-ledger-one-shot.yml
          git commit -m "docs(cpp): record K005 random stream parity"
          git push origin HEAD:feature/k005-random-stream-registry-cpp
