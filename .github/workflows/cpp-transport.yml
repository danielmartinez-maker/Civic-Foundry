name: C++ Transportation Stack

on:
  push:
    branches:
      - feature/stack-2-cpp-transportation-mobility
  pull_request:
    paths:
      - "cpp/engine/include/civic/transport/**"
      - "cpp/engine/include/civic/bridge/transport_c_api.h"
      - "cpp/engine/src/transport/**"
      - "cpp/engine/src/bridge/transport_c_api.cpp"
      - "cpp/tests/transport/**"
      - "cpp/transport/**"
      - ".github/workflows/cpp-transport.yml"

permissions:
  contents: read

jobs:
  linux:
    strategy:
      matrix:
        compiler: [gcc, clang]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Configure
        env:
          CC: ${{ matrix.compiler == 'gcc' && 'gcc' || 'clang' }}
          CXX: ${{ matrix.compiler == 'gcc' && 'g++' || 'clang++' }}
        run: cmake -S cpp/transport -B build/cpp-transport-${{ matrix.compiler }} -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - name: Build
        run: cmake --build build/cpp-transport-${{ matrix.compiler }} --parallel 2
      - name: Test
        run: ctest --test-dir build/cpp-transport-${{ matrix.compiler }} --output-on-failure

  sanitizer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Configure ASan/UBSan
        env:
          CC: clang
          CXX: clang++
        run: cmake -S cpp/transport -B build/cpp-transport-asan -DCMAKE_BUILD_TYPE=Debug -DCIVIC_TRANSPORT_ENABLE_SANITIZERS=ON
      - name: Build
        run: cmake --build build/cpp-transport-asan --parallel 2
      - name: Test
        run: ctest --test-dir build/cpp-transport-asan --output-on-failure

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Configure MSVC
        run: cmake -S cpp/transport -B build/cpp-transport-msvc -A x64
      - name: Build
        run: cmake --build build/cpp-transport-msvc --config Release --parallel 2
      - name: Test
        run: ctest --test-dir build/cpp-transport-msvc -C Release --output-on-failure
