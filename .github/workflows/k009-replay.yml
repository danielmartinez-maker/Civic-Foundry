name: K009 replay

on:
  push:
    branches:
      - feature/k009-authoritative-transaction-checkpoint-cpp-rewrite

permissions:
  contents: write

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: feature/k009-authoritative-transaction-checkpoint-cpp-rewrite
          fetch-depth: 0
      - name: Fetch protected K009 backup
        run: |
          git fetch origin backup/k009-pre-dependency-rebase-20260905
          git fetch origin backup/k006-pre-k007-integration-20260905
      - name: Apply K009 production and test delta with three-way merge
        shell: bash
        run: |
          git diff --binary 5d23541b814be5916c5327589c8b3ea5e7636291 backup/k009-pre-dependency-rebase-20260905 -- \
            cpp/CMakeLists.txt \
            cpp/engine/include/civic/core/AuthoritativeTransactionCheckpoint.hpp \
            cpp/engine/include/civic/core/NativeEngine.hpp \
            cpp/engine/src/core/AuthoritativeTransactionCheckpoint.cpp \
            cpp/engine/src/core/NativeEngine.cpp \
            cpp/tests/core/CoreTests.cpp > "$RUNNER_TEMP/k009.patch"
          git apply --3way --index "$RUNNER_TEMP/k009.patch"
      - name: Commit replay
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(K009): rebase transaction checkpoint onto accepted kernel'
          git push origin HEAD:feature/k009-authoritative-transaction-checkpoint-cpp-rewrite
