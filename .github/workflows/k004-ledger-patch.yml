name: K004 ledger patch

on:
  push:
    branches:
      - feature/k004-kernel-types-cpp-rewrite

permissions:
  contents: write

jobs:
  patch-ledger:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: feature/k004-kernel-types-cpp-rewrite
          fetch-depth: 0
      - name: Update K004 ledger entry
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'docs/cpp/TS_REWRITE_LEDGER.json';
          const ledger = JSON.parse(fs.readFileSync(path, 'utf8'));
          const entry = ledger.entries.find((candidate) => candidate.path === 'src/simulation/kernel/KernelTypes.ts');
          if (!entry) throw new Error('KernelTypes.ts ledger entry not found');
          entry.assignedStack = 'K004';
          entry.targetNativeOwner = 'civic/core/KernelTypes.hpp';
          entry.nativeTestOwner = 'cpp/tests/core/CoreTests.cpp';
          entry.status = 'shadow_complete';
          entry.currentAuthority = 'typescript';
          entry.parityClassification = 'parity';
          entry.cutoverDependencies = [];
          fs.writeFileSync(path, `${JSON.stringify(ledger, null, 2)}\n`, 'utf8');
          NODE
      - name: Commit ledger and remove staging workflow
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/k004-ledger-patch.yml
          git add docs/cpp/TS_REWRITE_LEDGER.json
          git commit -m "docs(k004): restore kernel types parity after K001 sync"
          git push origin HEAD:feature/k004-kernel-types-cpp-rewrite
