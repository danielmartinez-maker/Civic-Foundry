name: Phase 0A Browser Smoke

on:
  push:
    branches: [verify-phase0a-browser-smoke]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install TypeScript
        run: npm install --global typescript@5.8.3
      - name: Build
        run: npm run build
      - name: Install Playwright Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          CHROMIUM_PATH=$(python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              print(p.chromium.executable_path)
          PY
          )
          sudo ln -sf "$CHROMIUM_PATH" /usr/bin/chromium
      - name: Phase 6 browser smoke
        run: npm run test:smoke
      - name: Phase 7 browser smoke
        run: npm run test:smoke:phase7
