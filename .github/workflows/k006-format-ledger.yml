name: K006 format ledger

on:
  push:
    branches:
      - feature/k006-simulation-kernel-cpp-rewrite

permissions:
  contents: write

jobs:
  format-ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: feature/k006-simulation-kernel-cpp-rewrite
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Format ledger
        run: npx prettier --write docs/cpp/TS_REWRITE_LEDGER.json
      - name: Commit formatting
        run: |
          if git diff --quiet -- docs/cpp/TS_REWRITE_LEDGER.json; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/cpp/TS_REWRITE_LEDGER.json
          git commit -m 'style(K006): format rewrite ledger'
          git push origin HEAD:feature/k006-simulation-kernel-cpp-rewrite
