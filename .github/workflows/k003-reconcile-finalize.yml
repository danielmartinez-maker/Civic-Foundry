name: K003 K004 reconciliation finalizer

on:
  push:
    branches:
      - feat/k003-invariant-runner-cpp-rewrite
    paths:
      - .github/workflows/k003-reconcile-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: feat/k003-invariant-runner-cpp-rewrite
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Define native paths
        shell: bash
        run: |
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"
          echo "VCPKG_DEFAULT_BINARY_CACHE=$RUNNER_TEMP/vcpkg-cache" >> "$GITHUB_ENV"

      - name: Record K003 ledger state
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'docs/cpp/TS_REWRITE_LEDGER.json';
          const ledger = JSON.parse(fs.readFileSync(path, 'utf8'));
          const entry = ledger.entries.find((candidate) => candidate.path === 'src/simulation/kernel/InvariantRunner.ts');
          if (!entry || entry.inventoryId !== 'CF-TS-0097') throw new Error('K003 ledger entry identity mismatch');
          entry.assignedStack = 'K003';
          entry.targetNativeOwner = 'civic::InvariantRunner';
          entry.nativeTestOwner = 'cpp/tests/parity/ParityTests.cpp';
          entry.status = 'shadow_complete';
          entry.currentAuthority = 'typescript';
          entry.parityClassification = 'parity';
          entry.cutoverDependencies = [];
          const k004 = ledger.entries.find((candidate) => candidate.path === 'src/simulation/kernel/KernelTypes.ts');
          if (!k004 || k004.status !== 'shadow_complete' || k004.assignedStack !== 'K004') {
            throw new Error('K004 ledger state was not preserved during reconciliation');
          }
          fs.writeFileSync(path, `${JSON.stringify(ledger, null, 2)}\n`, 'utf8');
          NODE
          node scripts/cpp/ts-rewrite-ledger.mjs verify
          git diff --check

      - name: Cache vcpkg
        uses: actions/cache@v6.1.0
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-${{ runner.os }}-k003-k004-${{ hashFiles('cpp/vcpkg.json') }}

      - name: Bootstrap pinned vcpkg
        shell: bash
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          git clone --depth 1 --branch 2026.07.29 https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          echo "CMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" >> "$GITHUB_ENV"

      - name: Exact K003 invariant gate
        run: node scripts/cpp/run-native-round.mjs --regex "InvariantParity|InvariantContracts"

      - name: Exact K003 UTF16 gate
        run: node scripts/cpp/run-native-round.mjs --regex "InvariantContracts|Utf16"

      - name: Assert K004 helper integration
        shell: bash
        run: |
          grep -q 'validateCadence(invariant.cadence, invariant.id)' cpp/engine/src/core/Kernel.cpp
          grep -q 'isDue(invariant.cadence, tick)' cpp/engine/src/core/Kernel.cpp
          test -f cpp/engine/include/civic/core/KernelTypes.hpp

      - name: Fetch C005/C006 validators
        shell: bash
        run: |
          git fetch origin stack-c005-standardize-parity-evidence feature/c006-native-authority-flip-gates
          git show origin/stack-c005-standardize-parity-evidence:scripts/cpp/parity-evidence.mjs > /tmp/parity-evidence.mjs
          git show origin/feature/c006-native-authority-flip-gates:scripts/cpp/authority-gate.mjs > /tmp/authority-gate.mjs
          git show origin/feature/c006-native-authority-flip-gates:docs/cpp/NATIVE_AUTHORITY_STATE.json > /tmp/NATIVE_AUTHORITY_STATE.json
          node /tmp/authority-gate.mjs /tmp/NATIVE_AUTHORITY_STATE.json
          node <<'NODE'
          const fs = require('node:fs');
          const state = JSON.parse(fs.readFileSync('/tmp/NATIVE_AUTHORITY_STATE.json', 'utf8'));
          if (state.domains.kernel.runtimeNativeOwnership !== 'owned') throw new Error('kernel ownership baseline changed');
          for (const domain of ['world','cadastre','buildings','transportation','population','economy','services']) {
            if (state.domains[domain].runtimeNativeOwnership !== 'unowned') throw new Error(`${domain} unexpectedly native-owned`);
          }
          console.log('C006 authority state consistent; no gameplay authority transfer.');
          NODE

      - name: Generate TS semantic fixture
        shell: bash
        run: |
          cat > /tmp/k003-ts.ts <<'TS'
          import { InvariantRunner } from process.cwd() + '/src/simulation/kernel/InvariantRunner.ts';
          import type { KernelStepContext } from process.cwd() + '/src/simulation/kernel/KernelTypes.ts';
          const context = {} as KernelStepContext;
          const supplementary = '\u{10000}';
          const privateBmp = '\uE000';
          const orderRunner = new InvariantRunner();
          const order: string[] = [];
          orderRunner.register({ id: privateBmp, cadence: { every: 1 }, check: () => { order.push(privateBmp); } });
          orderRunner.register({ id: supplementary, cadence: { every: 1 }, check: () => { order.push(supplementary); } });
          orderRunner.runDue(0, context);
          const ids = orderRunner.list().map((entry) => entry.id);
          const cadenceRunner = new InvariantRunner();
          const ticks: number[] = [];
          cadenceRunner.register({ id: 'periodic', cadence: { every: 3, offset: 2 }, check: (ctx) => { ticks.push(ctx.tick); } });
          for (let tick = 0; tick <= 8; tick += 1) cadenceRunner.runDue(tick, { ...context, tick } as KernelStepContext);
          const failureRunner = new InvariantRunner();
          failureRunner.register({ id: 'broken', cadence: { every: 1 }, check: () => { throw new Error('underlying detail'); } });
          let failure = '';
          try { failureRunner.runDue(7, context); } catch (error) { failure = error instanceof Error ? error.message : String(error); }
          let originalCalls = 0;
          let mutatedCalls = 0;
          const definition = { id: 'stable', cadence: { every: 2, offset: 1 }, check: () => { originalCalls += 1; } };
          const copyRunner = new InvariantRunner();
          copyRunner.register(definition);
          definition.id = 'mutated';
          definition.cadence = { every: 1, offset: 0 };
          definition.check = () => { mutatedCalls += 1; };
          copyRunner.runDue(0, context);
          copyRunner.runDue(1, context);
          const copiedIds = copyRunner.list().map((entry) => entry.id);
          process.stdout.write(JSON.stringify({ ids, order, ticks, failure, copiedIds, originalCalls, mutatedCalls }));
          TS
          node --experimental-strip-types /tmp/k003-ts.ts > /tmp/k003-ts-1.json
          node --experimental-strip-types /tmp/k003-ts.ts > /tmp/k003-ts-2.json

      - name: Generate native semantic fixture
        shell: bash
        run: |
          cat > /tmp/k003-native.cpp <<'CPP'
          #include <civic/core/Kernel.hpp>
          #include <cstdint>
          #include <iostream>
          #include <sstream>
          #include <string>
          #include <vector>
          int main() {
            const std::string supplementary{"\xF0\x90\x80\x80"};
            const std::string privateBmp{"\xEE\x80\x80"};
            civic::InvariantRunner orderRunner;
            std::vector<std::string> order;
            if (!orderRunner.registerInvariant({privateBmp,{1,0},[&](std::uint64_t)->civic::Result<void>{order.push_back(privateBmp);return {};}})) return 10;
            if (!orderRunner.registerInvariant({supplementary,{1,0},[&](std::uint64_t)->civic::Result<void>{order.push_back(supplementary);return {};}})) return 11;
            if (!orderRunner.runDue(0)) return 12;
            const auto ids = orderRunner.listIds();
            civic::InvariantRunner cadenceRunner;
            std::vector<std::uint64_t> ticks;
            if (!cadenceRunner.registerInvariant({"periodic",{3,2},[&](std::uint64_t tick)->civic::Result<void>{ticks.push_back(tick);return {};}})) return 13;
            for (std::uint64_t tick=0; tick<=8; ++tick) if (!cadenceRunner.runDue(tick)) return 14;
            civic::InvariantRunner failureRunner;
            if (!failureRunner.registerInvariant({"broken",{1,0},[](std::uint64_t)->civic::Result<void>{return std::unexpected(civic::make_error(civic::ErrorCode::invalid_state,"underlying detail"));}})) return 15;
            const auto failed = failureRunner.runDue(7);
            if (failed || failed.error().code != civic::ErrorCode::invariant_failure) return 16;
            const auto failure = failed.error().message;
            int originalCalls=0, mutatedCalls=0;
            civic::InvariantDefinition definition{"stable",{2,1},[&](std::uint64_t)->civic::Result<void>{++originalCalls;return {};}};
            civic::InvariantRunner copyRunner;
            if (!copyRunner.registerInvariant(definition)) return 17;
            definition.id="mutated"; definition.cadence={1,0}; definition.check=[&](std::uint64_t)->civic::Result<void>{++mutatedCalls;return {};};
            if (!copyRunner.runDue(0) || !copyRunner.runDue(1)) return 18;
            const auto copiedIds=copyRunner.listIds();
            if (ids != std::vector<std::string>{supplementary,privateBmp}) return 19;
            if (order != std::vector<std::string>{supplementary,privateBmp}) return 20;
            if (ticks != std::vector<std::uint64_t>{2,5,8}) return 21;
            if (failure != "invariant failed [broken] at tick 7: underlying detail") return 22;
            if (copiedIds != std::vector<std::string>{"stable"} || originalCalls != 1 || mutatedCalls != 0) return 23;
            std::ostringstream json;
            json << "{\"ids\":[\""<<supplementary<<"\",\""<<privateBmp<<"\"],\"order\":[\""<<supplementary<<"\",\""<<privateBmp<<"\"],\"ticks\":[2,5,8],\"failure\":\""<<failure<<"\",\"copiedIds\":[\"stable\"],\"originalCalls\":"<<originalCalls<<",\"mutatedCalls\":"<<mutatedCalls<<"}";
            std::cout << json.str();
          }
          CPP
          g++ -std=c++23 -Icpp/engine/include /tmp/k003-native.cpp cpp/engine/src/core/Kernel.cpp -o /tmp/k003-native
          /tmp/k003-native > /tmp/k003-native-1.json
          /tmp/k003-native > /tmp/k003-native-2.json

      - name: Validate C005 PARITY evidence
        shell: bash
        run: |
          cat > /tmp/k003-evidence.mjs <<'NODE'
          import { mkdirSync, readFileSync, writeFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import { createHash } from 'node:crypto';
          const canonical = (value) => JSON.stringify(value, Object.keys(value).sort());
          const digest = (value) => createHash('sha256').update(JSON.stringify(value)).digest('hex');
          const ts1=JSON.parse(readFileSync('/tmp/k003-ts-1.json','utf8'));
          const ts2=JSON.parse(readFileSync('/tmp/k003-ts-2.json','utf8'));
          const native1=JSON.parse(readFileSync('/tmp/k003-native-1.json','utf8'));
          const native2=JSON.parse(readFileSync('/tmp/k003-native-2.json','utf8'));
          if (JSON.stringify(ts1) !== JSON.stringify(native1)) throw new Error('K003 TS/native semantic mismatch');
          if (JSON.stringify(ts1) !== JSON.stringify(ts2)) throw new Error('K003 TS repeat mismatch');
          if (JSON.stringify(native1) !== JSON.stringify(native2)) throw new Error('K003 native repeat mismatch');
          const snapshotSha=digest(ts1);
          const eventsSha=digest({order:ts1.order,ticks:ts1.ticks,failure:ts1.failure});
          const domainHash=BigInt(`0x${snapshotSha.slice(0,16)}`).toString();
          const generatedAtCommit=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
          const evidence={schemaVersion:1,stackId:'K003',fixtureId:'invariant-runner-k004-reconciled-parity',targetTick:8,classification:'PARITY',domains:[{domain:'kernel',typescript:{ownership:'owned',snapshotSha256:snapshotSha,eventsSha256:eventsSha,domainHashVersion:1,domainHash,invariants:'pass'},native:{ownership:'owned',snapshotSha256:snapshotSha,eventsSha256:eventsSha,domainHashVersion:1,domainHash,invariants:'pass'},comparison:{snapshot:'match',events:'match',domainHash:'match',invariants:'match'}}],determinism:{typescriptRepeatSha256:snapshotSha,nativeRepeatSha256:snapshotSha,typescriptRepeatMatch:true,nativeRepeatMatch:true},correction:null,generatedAtCommit};
          mkdirSync('test-artifacts/cpp-parity/K003',{recursive:true});
          writeFileSync('test-artifacts/cpp-parity/K003/invariant-runner-k004-reconciled-parity-tick-8.json',`${JSON.stringify(evidence,null,2)}\n`);
          NODE
          node /tmp/k003-evidence.mjs
          node /tmp/parity-evidence.mjs test-artifacts/cpp-parity/K003/invariant-runner-k004-reconciled-parity-tick-8.json

      - name: Upload parity evidence
        uses: actions/upload-artifact@v4
        with:
          name: k003-k004-reconciled-parity-evidence
          path: test-artifacts/cpp-parity/K003/invariant-runner-k004-reconciled-parity-tick-8.json
          if-no-files-found: error

      - name: Commit ledger and self-delete
        shell: bash
        run: |
          rm -rf test-artifacts/cpp-parity/K003
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/k003-reconcile-finalize.yml
          git add docs/cpp/TS_REWRITE_LEDGER.json
          git diff --cached --check
          git commit -m "docs(cpp): finalize K003 after K004 reconciliation"
          git push origin HEAD:feat/k003-invariant-runner-cpp-rewrite
