name: K007 captureAll parity refinement

on:
  push:
    branches: [feature/k007-snapshot-registry-cpp-rewrite]
    paths: [.github/workflows/k007-captureall-parity.yml]

permissions:
  contents: write

jobs:
  red-green-refinement:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: feature/k007-snapshot-registry-cpp-rewrite
          fetch-depth: 0
      - uses: actions/setup-node@v6.1.0
        with:
          node-version: 22
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtest-dev libjson-c-dev
      - name: Add regression test
        shell: python
        run: |
          import base64
          from pathlib import Path
          encoded = ""
          test = base64.b64decode(encoded).decode()
          path = Path("cpp/tests/core/CoreTests.cpp")
          text = path.read_text()
          marker = "TEST(NativeEngineContracts, StepZeroIsSideEffectFreeAndDomainsAreExplicitlyUnowned) {"
          if marker not in text:
              raise SystemExit("insertion marker missing")
          path.write_text(text.replace(marker, test + marker, 1))
      - name: RED captureAll parity
        shell: bash
        run: |
          set +e
          node scripts/cpp/run-native-round.mjs --regex "SnapshotRegistryParity.CaptureAllFreezesProviderSetBeforeCapture" 2>&1 | tee /tmp/red.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -ne 0
          grep -q "CaptureAllFreezesProviderSetBeforeCapture" /tmp/red.log
      - name: Apply parity fix
        shell: python
        run: |
          import base64
          from pathlib import Path
          old = base64.b64decode("").decode()
          new = base64.b64decode("").decode()
          path = Path("cpp/engine/src/core/SnapshotRegistry.cpp")
          text = path.read_text()
          if old not in text:
              raise SystemExit("captureAll marker missing")
          path.write_text(text.replace(old, new, 1))
      - name: GREEN K007 focused gate
        run: node scripts/cpp/run-native-round.mjs --regex "SnapshotRegistryParity|NativeEngineContracts"
      - name: C005 parity evidence
        run: node scripts/cpp/run-native-round.mjs --regex "CAbi|RandomParity"
      - name: Commit final refinement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/k007-captureall-parity.yml
          git add cpp/tests/core/CoreTests.cpp cpp/engine/src/core/SnapshotRegistry.cpp
          git commit -m "fix(k007): match captureAll provider-set semantics"
          git push origin HEAD:feature/k007-snapshot-registry-cpp-rewrite
