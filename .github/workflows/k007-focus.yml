name: K007 focused native verification

on:
  push:
    branches:
      - feature/k007-snapshot-registry-cpp-rewrite
    paths:
      - .github/workflows/k007-focus.yml

permissions:
  contents: write

jobs:
  focused-native:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout K007 branch
        uses: actions/checkout@v7.0.1
        with:
          ref: feature/k007-snapshot-registry-cpp-rewrite
          fetch-depth: 0

      - name: Node 22
        uses: actions/setup-node@v6.1.0
        with:
          node-version: 22

      - name: Install native round dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtest-dev libjson-c-dev

      - name: K007 focused native round
        run: node scripts/cpp/run-native-round.mjs --regex "SnapshotRegistryParity|NativeEngineContracts"

      - name: C005 parity evidence
        run: node scripts/cpp/run-native-round.mjs --regex "RandomParity|NativeEngineParity"

      - name: Update K007 rewrite ledger
        shell: python
        run: |
          import json
          from pathlib import Path

          path = Path("docs/cpp/TS_REWRITE_LEDGER.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          matches = [entry for entry in data["entries"] if entry["inventoryId"] == "CF-TS-0101"]
          if len(matches) != 1:
              raise SystemExit(f"expected exactly one CF-TS-0101 entry, found {len(matches)}")
          entry = matches[0]
          if entry["path"] != "src/simulation/kernel/SnapshotRegistry.ts":
              raise SystemExit("CF-TS-0101 path mismatch")
          entry["assignedStack"] = "K007"
          entry["targetNativeOwner"] = "civic::SnapshotRegistry"
          entry["nativeTestOwner"] = "cpp/tests/core/CoreTests.cpp"
          entry["status"] = "shadow_complete"
          entry["currentAuthority"] = "typescript"
          entry["parityClassification"] = "parity"
          path.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")

      - name: Commit ledger evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- docs/cpp/TS_REWRITE_LEDGER.json; then
            echo "Ledger already matches K007."
            exit 0
          fi
          git add docs/cpp/TS_REWRITE_LEDGER.json
          git commit -m "docs(k007): mark snapshot registry shadow complete"
          git push origin HEAD:feature/k007-snapshot-registry-cpp-rewrite
