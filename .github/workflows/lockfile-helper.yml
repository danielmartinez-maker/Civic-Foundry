name: Civic Foundry Lockfile Helper

on:
  pull_request:

permissions:
  contents: write

jobs:
  generate-lockfile:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull-request head
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Node 22
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Generate exact 3D dependency lockfile
        run: |
          npm install --save-exact @babylonjs/core@9.23.0 @babylonjs/loaders@9.23.0
          npm install --save-dev --save-exact @gltf-transform/core@4.4.2 @gltf-transform/functions@4.4.2
      - name: Commit exact lockfile when changed
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: pin babylon and gltf transform dependencies"
          git push origin "HEAD:${HEAD_REF}"
