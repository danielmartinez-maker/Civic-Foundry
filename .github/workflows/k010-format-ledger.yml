name: K010 Ledger Format

on:
  push:
    branches:
      - feature/k010-legacy-simulation-core-cpp-rewrite

permissions:
  contents: write

jobs:
  format-ledger:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: feature/k010-legacy-simulation-core-cpp-rewrite
          fetch-depth: 0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run format
      - name: Commit normalized ledger when needed
        shell: bash
        run: |
          if git diff --quiet -- docs/cpp/TS_REWRITE_LEDGER.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/cpp/TS_REWRITE_LEDGER.json
          git commit -m "K010: normalize rewrite ledger formatting"
          git push origin HEAD:feature/k010-legacy-simulation-core-cpp-rewrite
