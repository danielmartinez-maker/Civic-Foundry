name: K009 focused native round

on:
  push:
    branches:
      - feature/k009-authoritative-transaction-checkpoint-cpp-rewrite

permissions:
  contents: read

jobs:
  focused-round:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
      - name: Install native round dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libjson-c-dev libgtest-dev
      - name: Run K009 required native round
        run: node scripts/cpp/run-native-round.mjs --regex "TransactionCheckpoint|NativeKernelParity"
