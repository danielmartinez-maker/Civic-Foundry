name: Phase 7 Type Fix

on:
  push:
    branches: [phase7-tenure-relocation]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[phase7-type-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase7-tenure-relocation
          fetch-depth: 0
      - name: Fix housing capacity map key typing
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/simulation/core/SimulationCore.ts')
          text = p.read_text()
          old = "const optionCapacities = new Map(this.housingTenureSnapshot.options.map((option) => [`${option.buildingId}|${option.tenure}`, option.capacity] as const));"
          new = "const optionCapacities = new Map<string, number>(this.housingTenureSnapshot.options.map((option) => [`${option.buildingId}|${option.tenure}`, option.capacity] as const));"
          if text.count(old) != 1:
              raise SystemExit(f'expected one optionCapacities declaration, found {text.count(old)}')
          p.write_text(text.replace(old, new, 1))
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/simulation/core/SimulationCore.ts
          git commit -m 'fix: type housing tenure capacity map [phase7-type-fix]'
          git push origin HEAD:phase7-tenure-relocation
