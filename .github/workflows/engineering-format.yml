name: Engineering Format

on:
  push:
    branches: [chore/engineering-baseline-v1]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chore/engineering-baseline-v1
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Format engineering surfaces
        run: npm run format
      - name: Commit formatting when changed
        run: |
          if git diff --quiet; then
            echo "Formatting already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json tsconfig.json eslint.config.mjs scripts tests/repository_policy.test.ts tests/architecture_policy.test.ts tests/build_script.test.ts tests/asset_policy.test.ts README.md CONTRIBUTING.md docs/ENGINEERING_STANDARDS.md docs/adr
          git commit -m "style: normalize engineering surfaces"
          git push origin HEAD:chore/engineering-baseline-v1
