name: B1 Task3 Direct Patch

on:
  push:
    branches:
      - feature/urban-depth-b1

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/urban-depth-b1
          fetch-depth: 0
      - name: Apply coordinator patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one anchor, found {count}')
              return text.replace(old, new, 1)

          core_path = Path('src/simulation/core/SimulationCore.ts')
          core = core_path.read_text()
          if 'syncUrbanFabricCompatibility' not in core:
              core = replace_once(
                  core,
                  "import { buildUrbanBuildingView, legacyUrbanStateForBuilding, type UrbanBuildingView } from '../urban/UrbanBuildingView.ts';",
                  "import { buildUrbanBuildingView, compatibilityUrbanStateForBuilding, legacyUrbanStateForBuilding, urbanBusinessSiteFromView, type UrbanBuildingView } from '../urban/UrbanBuildingView.ts';",
                  'core urban import',
              )
              core = replace_once(
                  core,
                  "      const buildingZones = new Map(this.buildings.occupied().map((building) => [building.id, building.zone] as const));",
                  "      const residentialBuildingIds = new Set(this.urbanBuildingViews().filter((view) => view.occupancyEligible && view.residentialCapacity > 0).map((view) => view.buildingId));",
                  'housing validation map',
              )
              core = replace_once(
                  core,
                  "        if (buildingZones.get(allocation.buildingId) !== 'residential') throw new Error('invalid housing allocation building reference');",
                  "        if (!residentialBuildingIds.has(allocation.buildingId)) throw new Error('invalid housing allocation building reference');",
                  'housing validation',
              )
              core = replace_once(
                  core,
                  "    const buildingBeforeRemoval = this.buildings.getAt(x, y);\n    const housingBeforeRemoval = buildingBeforeRemoval?.zone === 'residential'\n      ? this.housingRelocation.snapshotState()\n      : undefined;\n    if (buildingBeforeRemoval?.zone === 'residential') this.housingRelocation.displaceBuilding(buildingBeforeRemoval.id);",
                  "    const buildingBeforeRemoval = this.buildings.getAt(x, y);\n    const urbanBeforeRemoval = buildingBeforeRemoval ? this.urbanBuildingView(buildingBeforeRemoval.id) : undefined;\n    const hadHousing = (urbanBeforeRemoval?.residentialCapacity ?? 0) > 0;\n    const housingBeforeRemoval = hadHousing ? this.housingRelocation.snapshotState() : undefined;\n    if (buildingBeforeRemoval && hadHousing) this.housingRelocation.displaceBuilding(buildingBeforeRemoval.id);",
                  'bulldoze prelude',
              )
              core = replace_once(
                  core,
                  "      this.economyDomain.removeBuilding(building.id, this.clock.tick);\n      this.developerMarket.cancelProject(building.id, 0.50);\n      if (building.zone === 'residential') {",
                  "      this.economyDomain.removeBuilding(building.id, this.clock.tick);\n      this.urbanFabric.remove(building.id);\n      this.developerMarket.cancelProject(building.id, 0.50);\n      if (hadHousing) {",
                  'bulldoze cleanup',
              )
              core = replace_once(
                  core,
                  "  private runLegacyV7Tick(): void {\n    this.transportationGraph.rebuildIfNeeded(this.roads);",
                  "  private runLegacyV7Tick(): void {\n    this.syncUrbanFabricCompatibility();\n    this.transportationGraph.rebuildIfNeeded(this.roads);",
                  'pre tick sync',
              )
              core = replace_once(
                  core,
                  "      ...(this.clock.tick % 250 === 0 ? { buildings: this.buildings.occupied() } : {}),",
                  "      ...(this.clock.tick % 250 === 0 ? { businessSites: this.urbanBuildingViews().map(urbanBusinessSiteFromView).filter((site) => site.totalJobCapacity > 0) } : {}),",
                  'economy sites',
              )
              core = replace_once(
                  core,
                  "    this.buildings.tick(this.clock.tick);\n    this.developerMarket.advance(this.clock.tick);",
                  "    this.buildings.tick(this.clock.tick);\n    this.syncUrbanFabricCompatibility();\n    this.developerMarket.advance(this.clock.tick);",
                  'post building sync',
              )
              core = replace_once(
                  core,
                  "  private evaluateCoreCityLoop(): void {\n    const occupied = this.buildings.occupied();",
                  "  private evaluateCoreCityLoop(): void {\n    const occupied = this.buildings.occupied();\n    const urbanViews = this.urbanBuildingViews();",
                  'core views',
              )
              core = replace_once(core, "    this.taxRevenue = this.taxes.calculateRevenue(occupied);", "    this.taxRevenue = this.taxes.calculateUrbanRevenue(urbanViews);", 'urban tax')
              core = replace_once(core, "    this.population.update(this.buildings.residentialCapacity(), attractiveness);", "    this.population.update(urbanViews.reduce((sum, view) => sum + view.residentialCapacity, 0), attractiveness);", 'population capacity')

              old_tenure = '''  private refreshHousingTenure(): HousingTenureSnapshot {
    const lotsById = new Map(this.lots.list().map((lot) => [lot.id, lot] as const));
    const inputs = [];
    const rentFactor = this.developmentPolicy.residentialRentFactor();
    for (const building of this.buildings.occupied()) {
      if (building.zone !== 'residential') continue;
      const lot = lotsById.get(building.lotId);
      if (!lot) continue;
      const definition = definitionForBuilding(building);
      const local = this.localParcelContextForLot(lot);
      const market = this.landHousingMarket.parcelSignal('residential', {
        personAccessibility: local.personAccessibility,
        freightAccessibility: local.freightAccessibility,
        serviceQuality: local.serviceQuality,
        neighborhoodQuality: local.neighborhoodQuality,
        utilityRatio: local.utilityRatio,
        frontageAccessBonus: local.roadAccessBonus,
      });
      inputs.push({
        buildingId: building.id,
        intensity: definition.intensity,
        capacity: definition.residentCapacity,
        askingRent: definition.baseRent * market.marketRentMultiplier * rentFactor,
        personAccessibility: local.personAccessibility,
        serviceQuality: local.serviceQuality,
        neighborhoodQuality: local.neighborhoodQuality,
        utilityRatio: local.utilityRatio,
      });
    }
    return this.housingTenure.evaluate(this.currentDevelopmentInterestRate(), inputs);
  }
'''
              new_tenure = '''  private refreshHousingTenure(): HousingTenureSnapshot {
    this.syncUrbanFabricCompatibility();
    const lotsById = new Map(this.lots.list().map((lot) => [lot.id, lot] as const));
    const buildingsById = new Map(this.buildings.list().map((building) => [building.id, building] as const));
    const inputs = [];
    const rentFactor = this.developmentPolicy.residentialRentFactor();
    for (const view of this.urbanBuildingViews()) {
      if (!view.newOccupancyEligible || view.residentialCapacity <= 0) continue;
      const building = buildingsById.get(view.buildingId);
      const lot = building ? lotsById.get(building.lotId) : undefined;
      if (!building || !lot) continue;
      const definition = definitionForBuilding(building);
      const local = this.localParcelContextForLot(lot);
      const market = this.landHousingMarket.parcelSignal('residential', {
        personAccessibility: local.personAccessibility,
        freightAccessibility: local.freightAccessibility,
        serviceQuality: local.serviceQuality,
        neighborhoodQuality: local.neighborhoodQuality,
        utilityRatio: local.utilityRatio,
        frontageAccessBonus: local.roadAccessBonus,
      });
      inputs.push({
        buildingId: view.buildingId,
        intensity: view.intensity,
        capacity: view.residentialCapacity,
        askingRent: definition.baseRent * market.marketRentMultiplier * rentFactor,
        personAccessibility: local.personAccessibility,
        serviceQuality: local.serviceQuality,
        neighborhoodQuality: local.neighborhoodQuality,
        utilityRatio: local.utilityRatio,
      });
    }
    return this.housingTenure.evaluate(this.currentDevelopmentInterestRate(), inputs);
  }
'''
              core = replace_once(core, old_tenure, new_tenure, 'housing tenure')
              core = replace_once(core, "      residentialCapacity: this.buildings.residentialCapacity(),", "      residentialCapacity: this.urbanBuildingViews().reduce((sum, view) => sum + view.residentialCapacity, 0),", 'land housing capacity')
              core = replace_once(
                  core,
                  "          const { removed } = this.buildings.replaceDevelopment(this.clock.tick, lot, award);\n          this.economyDomain.removeBuilding(removed.id, this.clock.tick);",
                  "          const { removed } = this.buildings.replaceDevelopment(this.clock.tick, lot, award);\n          this.economyDomain.removeBuilding(removed.id, this.clock.tick);\n          this.urbanFabric.remove(removed.id);",
                  'redevelopment state cleanup',
              )
              core = replace_once(
                  core,
                  "    if (awards.length > 0) {\n      this.refreshLandHousingMarket();",
                  "    if (awards.length > 0) {\n      this.syncUrbanFabricCompatibility();\n      this.refreshLandHousingMarket();",
                  'award semantic sync',
              )
              marker = "  private currentDevelopmentInterestRate(): number {"
              sync_method = '''  private syncUrbanFabricCompatibility(): void {
    const buildings = this.buildings.list().sort((a, b) => a.id.localeCompare(b.id));
    const liveIds = new Set(buildings.map((building) => building.id));
    for (const state of this.urbanFabric.list()) {
      if (!liveIds.has(state.buildingId)) this.urbanFabric.remove(state.buildingId);
    }
    for (const building of buildings) {
      const state = this.urbanFabric.get(building.id);
      if (!state) {
        this.urbanFabric.install(compatibilityUrbanStateForBuilding(building, this.clock.tick));
        continue;
      }
      if (building.status === 'occupied' && state.lifecycleState === 'construction') {
        this.urbanFabric.replace({ ...state, lifecycleState: 'stabilized' });
      }
    }
  }

'''
              core = replace_once(core, marker, sync_method + marker, 'sync method')
              core_path.write_text(core)

          economy_path = Path('src/simulation/economy/EconomyScheduler.ts')
          economy = economy_path.read_text()
          if 'businessSites?:readonly UrbanBusinessSite[]' not in economy:
              economy = replace_once(economy, "import type { Building } from '../buildings/BuildingSystem.ts';\n", "import type { Building } from '../buildings/BuildingSystem.ts';\nimport type { UrbanBusinessSite } from '../urban/UrbanBuildingView.ts';\n", 'economy import')
              economy = replace_once(economy, "  tick:number;buildings?:readonly Building[];population:number;graph:TransportationGraph;pathfinding:PathfindingSystem;roadTravelTime:(edge:TransportationEdge)=>number;", "  tick:number;buildings?:readonly Building[];businessSites?:readonly UrbanBusinessSite[];population:number;graph:TransportationGraph;pathfinding:PathfindingSystem;roadTravelTime:(edge:TransportationEdge)=>number;", 'economy input')
              economy = replace_once(economy, "  private readonly employmentSystem=new EmploymentSystem(); private cachedBuildings=new Map<string,Building>(); private lastGraphRevision=-1; private nextShipmentId=1;", "  private readonly employmentSystem=new EmploymentSystem(); private cachedBuildings=new Map<string,Building>(); private cachedBusinessSites=new Map<string,UrbanBusinessSite>(); private lastGraphRevision=-1; private nextShipmentId=1;", 'economy cache')
              economy = replace_once(economy, "    if(input.tick%ECONOMY_CADENCE.lifecycle===0&&input.buildings){this.cachedBuildings=new Map(input.buildings.map(b=>[b.id,{...b}]));this.firms.syncEligibleBuildings(input.buildings,input.tick);this.runLifecycle(input);}", "    if(input.tick%ECONOMY_CADENCE.lifecycle===0&&(input.businessSites||input.buildings)){if(input.businessSites){this.cachedBusinessSites=new Map(input.businessSites.map(site=>[site.buildingId,{...site}]));this.firms.syncEligibleSites(input.businessSites,input.tick);}else if(input.buildings){this.cachedBuildings=new Map(input.buildings.map(b=>[b.id,{...b}]));this.firms.syncEligibleBuildings(input.buildings,input.tick);}this.runLifecycle(input);}", 'economy lifecycle')
              economy = replace_once(economy, "  restoreDerivedContext(buildings:readonly Building[]):void{this.cachedBuildings=new Map(buildings.map(building=>[building.id,{...building}]));}", "  restoreDerivedContext(buildings:readonly Building[]):void{this.cachedBuildings=new Map(buildings.map(building=>[building.id,{...building}]));}\n  restoreSemanticDerivedContext(sites:readonly UrbanBusinessSite[]):void{this.cachedBusinessSites=new Map(sites.map(site=>[site.buildingId,{...site}]));}", 'economy restore')
              economy = replace_once(economy, "  private accessNodesForFirm(firm:Firm|undefined,graph:TransportationGraph):string[]{if(!firm)return[];const building=this.cachedBuildings.get(firm.buildingId);if(!building)return[];return CARDINAL.map(([dx,dy])=>graph.findNodeAt(building.x+dx,building.y+dy)?.id).filter((id):id is string=>id!==undefined).sort();}", "  private accessNodesForFirm(firm:Firm|undefined,graph:TransportationGraph):string[]{if(!firm)return[];const site=this.cachedBusinessSites.get(firm.buildingId);const building=site??this.cachedBuildings.get(firm.buildingId);if(!building)return[];return CARDINAL.map(([dx,dy])=>graph.findNodeAt(building.x+dx,building.y+dy)?.id).filter((id):id is string=>id!==undefined).sort();}", 'economy access')
              economy_path.write_text(economy)
          PY
      - name: Commit coordinator patch
        shell: bash
        run: |
          if git diff --quiet -- src/simulation/core/SimulationCore.ts src/simulation/economy/EconomyScheduler.ts; then
            exit 0
          fi
          git config user.name "danielmartinez-maker"
          git config user.email "daniel.martinez@lomasaltas.edu.mx"
          git add src/simulation/core/SimulationCore.ts src/simulation/economy/EconomyScheduler.ts
          git commit -m "feat: route core accounting through urban views"
          git push origin HEAD:feature/urban-depth-b1
