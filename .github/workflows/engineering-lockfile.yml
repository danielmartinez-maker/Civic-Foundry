name: Engineering Lockfile

on:
  push:
    branches: [chore/engineering-baseline-v1]

permissions:
  contents: write

concurrency:
  group: engineering-lockfile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chore/engineering-baseline-v1
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate exact npm lockfile
        run: |
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile when changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: refresh engineering lockfile"
          git push origin HEAD:chore/engineering-baseline-v1
