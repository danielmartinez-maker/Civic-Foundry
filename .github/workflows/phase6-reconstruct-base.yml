name: Phase 6 Reconstruct Trusted Base

on:
  pull_request:
    branches: [phase6-plan-staging]

permissions:
  contents: write

jobs:
  reconstruct:
    if: github.head_ref == 'phase6-execution'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout execution branch
        uses: actions/checkout@v4
        with:
          ref: phase6-execution
          fetch-depth: 2
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned TypeScript compiler
        run: npm install --global typescript@5.8.3
      - name: Reconstruct final Phase 6 tree
        shell: bash
        run: |
          set -euo pipefail
          cat .phase6.final.patch.chunk* > /tmp/phase6-final.patch.b64
          echo "948c7426f410d72353084d05309005773c2da7309fa7049bf3d24569baeaedc5  /tmp/phase6-final.patch.b64" | sha256sum -c -
          base64 -d /tmp/phase6-final.patch.b64 | gzip -dc > /tmp/phase6-final.patch
          echo "b02fad562ac12fa91afe293f5fae4e20792b920cd3aeaea2a22a3a59f7c0a3c4  /tmp/phase6-final.patch" | sha256sum -c -
          git apply --index /tmp/phase6-final.patch
          git rm .phase6.final.patch.chunk* .phase6.tasks8-9.patch.b64 .github/workflows/phase6-tasks8-9-checkpoint.yml
      - name: Full verification
        shell: bash
        run: |
          set -euo pipefail
          npm test
          npm run typecheck
          npm run lint
          npm run build
          git diff --cached --check
          if grep -RInE 'TODO|TBD|FIXME|PLACEHOLDER|coming soon' src tests README.md package.json; then
            echo 'unfinished Phase 6 marker found'
            exit 1
          fi
      - name: Commit and push final checkpoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: complete verified Phase 6 economy"
          git push origin HEAD:phase6-execution
