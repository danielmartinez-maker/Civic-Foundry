name: Stack 3 Task 2 Assets

on:
  push:
    branches: [feature/stack-3-3d-presentation-asset-scaleup]

permissions:
  contents: write

jobs:
  generate:
    if: ${{ !contains(github.event.head_commit.message, '[stack3-task2-green]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: feature/stack-3-3d-presentation-asset-scaleup
          fetch-depth: 0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
      - name: Generate controlled first-wave sources
        run: node scripts/stack3-task2-assets.mjs
      - name: Commit generated sources
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No asset-source changes required.'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/source/3d
          git commit -m 'feat: add Stack 3 first production asset wave [stack3-task2-green]'
          git push origin HEAD:feature/stack-3-3d-presentation-asset-scaleup
