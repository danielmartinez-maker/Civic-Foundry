name: Civic Foundry CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install project dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Install pinned TypeScript compiler
        run: npm install --global typescript@5.8.3
      - name: Install atlas rasterizer and browser smoke runtime
        run: |
          python -m pip install playwright==1.55.0 Pillow==11.3.0
          python -m playwright install --with-deps chromium
      - name: Tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Asset source validation
        run: npm run assets:check
      - name: Build
        run: npm run build
      - name: Phase 6 browser smoke
        run: npm run test:smoke
      - name: Phase 7 browser smoke
        run: npm run test:smoke:phase7
      - name: Isometric Pass A browser smoke
        run: npm run test:smoke:isometric
      - name: Isometric Pass A visual smoke
        run: python tests/smoke/isometric_visual_smoke.py
