name: Phase 0B Integrity Profile 2

on:
  pull_request:

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Split commit and invariant cost
        run: node --experimental-strip-types --test tests/phase0b-integrity-profile.test.ts
