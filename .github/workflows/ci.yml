name: Civic Foundry CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - name: Apply Phase 7 pre-merge review fixes
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'phase7-tenure-relocation' }}
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count == 0:
                  return text
              if count != 1:
                  raise SystemExit(f'{label}: expected at most one match, found {count}')
              return text.replace(old, new, 1)

          p = Path('src/simulation/housing/HousingRelocationSystem.ts')
          text = p.read_text()
          marker = '''function emptyCycle(): CycleMetrics {
            return {
              moved: 0,
              displaced: 0,
              rehoused: 0,
              failed: 0,
              movedInByBuilding: new Map(),
              movedOutByBuilding: new Map(),
              displacedByBuilding: new Map(),
            };
          }
'''
          replacement = marker + '''
          function cloneCycle(cycle: CycleMetrics): CycleMetrics {
            return {
              moved: cycle.moved,
              displaced: cycle.displaced,
              rehoused: cycle.rehoused,
              failed: cycle.failed,
              movedInByBuilding: new Map(cycle.movedInByBuilding),
              movedOutByBuilding: new Map(cycle.movedOutByBuilding),
              displacedByBuilding: new Map(cycle.displacedByBuilding),
            };
          }
'''
          text = replace_once(text, marker, replacement, 'cloneCycle insertion')
          text = replace_once(text, '  private pendingCycle = emptyCycle();\n', '  private pendingCycle = emptyCycle();\n  private latestCycle = emptyCycle();\n', 'latestCycle field')
          text = replace_once(text, '    this.pendingCycle = emptyCycle();\n    const cycle = emptyCycle();\n', '    this.pendingCycle = emptyCycle();\n    this.latestCycle = emptyCycle();\n    const cycle = emptyCycle();\n', 'initialize cycle reset')
          text = replace_once(text, '    this.latest = this.buildSnapshot(input.population, options, cycle);\n', '    this.latestCycle = cloneCycle(cycle);\n    this.latest = this.buildSnapshot(input.population, options, this.latestCycle);\n', 'reconcile latest cycle')
          text = replace_once(text, '    this.latest = this.buildSnapshot(population, validOptions, emptyCycle());\n', '    this.latest = this.buildSnapshot(population, validOptions, this.latestCycle);\n', 'derived refresh cycle preservation')
          text = replace_once(text, '    this.initialized = true;\n    this.pendingCycle = emptyCycle();\n    return this.snapshotState();\n', '    this.initialized = true;\n    this.pendingCycle = emptyCycle();\n    this.latestCycle = emptyCycle();\n    return this.snapshotState();\n', 'restore cycle reset')
          p.write_text(text)

          p = Path('src/simulation/core/SimulationCore.ts')
          text = p.read_text()
          text = replace_once(
              text,
              '''    this.refreshLandHousingMarket();
              this.refreshHousingTenure();
              this.housingRelocation.reconcile({ population: this.population.population, options: this.housingTenureSnapshot.options, allowVoluntaryMoves: true });
              this.refreshHousingChoice();
              this.demandSnapshot = this.demand.evaluate({''',
              '''    this.refreshLandHousingMarket();
              this.refreshHousingTenure();
              this.syncHousingPopulationWithoutVoluntaryMoves();
              this.refreshHousingChoice();
              this.demandSnapshot = this.demand.evaluate({''',
              'pre-population housing sync',
          )
          text = replace_once(
              text,
              '''    this.housingRelocation.reconcile({ population: this.population.population, options: this.housingTenureSnapshot.options, allowVoluntaryMoves: false });
              this.refreshHousingChoice();
              this.refreshRedevelopmentPressure();''',
              '''    this.housingRelocation.reconcile({ population: this.population.population, options: this.housingTenureSnapshot.options, allowVoluntaryMoves: true });
              this.refreshHousingChoice();
              this.refreshRedevelopmentPressure();''',
              'post-population voluntary reconcile',
          )
          p.write_text(text)

          p = Path('src/simulation/development/RedevelopmentExecutionSystem.ts')
          text = p.read_text()
          text = replace_once(
              text,
              '''      if (
                displacedLowerIncomeResidents > 0
                && Math.max(0, lowerIncomeAffordableSlack - reservedLowerIncomeSlack)
                  < displacedLowerIncomeResidents * lowerIncomeRelocationProtection
              ) {''',
              '''      const requiredLowerIncomeSlack = displacedLowerIncomeResidents * lowerIncomeRelocationProtection;
              if (
                displacedLowerIncomeResidents > 0
                && Math.max(0, lowerIncomeAffordableSlack - reservedLowerIncomeSlack) < requiredLowerIncomeSlack
              ) {''',
              'lower-income requirement',
          )
          text = replace_once(text, '      reservedLowerIncomeSlack += displacedLowerIncomeResidents;\n', '      reservedLowerIncomeSlack += requiredLowerIncomeSlack;\n', 'lower-income cumulative reservation')
          p.write_text(text)
      - name: Commit Phase 7 review fixes if changed
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'phase7-tenure-relocation' }}
        run: |
          if git diff --quiet -- src/simulation/housing/HousingRelocationSystem.ts src/simulation/core/SimulationCore.ts src/simulation/development/RedevelopmentExecutionSystem.ts; then
            echo 'Review fixes already applied.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add src/simulation/housing/HousingRelocationSystem.ts src/simulation/core/SimulationCore.ts src/simulation/development/RedevelopmentExecutionSystem.ts
            git commit -m 'fix: preserve Phase 7 relocation semantics [phase7-review-fix]'
            git push origin HEAD:phase7-tenure-relocation
          fi
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned TypeScript compiler
        run: npm install --global typescript@5.8.3
      - name: Tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build