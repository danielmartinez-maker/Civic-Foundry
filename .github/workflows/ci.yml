name: Phase 0B Performance Gate

on:
  pull_request:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Phase 6 economy benchmark x5
        shell: bash
        run: |
          for sample in 1 2 3 4 5; do
            echo "PHASE0B_PERF_SAMPLE=${sample}"
            node --experimental-strip-types --test --test-name-pattern="performance: 5000 active economy ticks remain an interactive diagnostic" tests/phase6-headless.test.ts
          done
