name: Civic Foundry CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Node 22
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Bootstrap desktop dependency lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Persist desktop dependency lockfile
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if git diff --quiet -- package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build: resolve desktop dependency lockfile"
          git push origin HEAD:${GITHUB_HEAD_REF}
      - name: Upload desktop dependency lockfile
        uses: actions/upload-artifact@v4
        with:
          name: desktop-lockfile
          path: |
            package.json
            package-lock.json
          if-no-files-found: error
      - name: Install project dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install atlas rasterizer and browser smoke runtime
        run: |
          python -m pip install playwright==1.55.0 Pillow==11.3.0
          python -m playwright install --with-deps chromium
      - name: Core verification
        run: npm run verify
      - name: Phase 6 browser smoke
        run: npm run test:smoke
      - name: Phase 7 browser smoke
        run: npm run test:smoke:phase7
      - name: Urban Fabric browser smoke
        run: npm run test:smoke:urban-fabric
      - name: Isometric Pass A browser smoke
        run: npm run test:smoke:isometric
      - name: Isometric Pass A visual smoke
        run: python tests/smoke/isometric_visual_smoke.py