name: Civic Foundry CI

on:
  push:
    branches: [metropolitan-era]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Package source snapshot
        run: tar --exclude=.git -cf /tmp/civic-foundry-source.tar .
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: phase6-source-snapshot
          path: /tmp/civic-foundry-source.tar
          if-no-files-found: error
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned TypeScript compiler
        run: npm install --global typescript@5.8.3
      - name: Tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
