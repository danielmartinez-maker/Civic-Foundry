name: Phase 0B Traffic Identity Performance Diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Alternate anchor and traffic-identity fix on one runner
        shell: bash
        run: |
          set -euo pipefail
          ANCHOR=b063ef10211ea35780c13a08b7f33eec6bc3b1c4
          POST=0eeb9b8754955be4e9c9ff47a69c26f23352586e
          git fetch --no-tags origin phase0b-perf-base-anchor civic-2.0-phase-0b-inline
          run_bench() {
            label="$1"
            sample="$2"
            revision="$3"
            git checkout --quiet --detach "$revision"
            echo "PHASE0B_PAIRED label=${label} sample=${sample} sha=${revision}"
            node --experimental-strip-types --test --test-name-pattern="performance: 5000 active economy ticks remain an interactive diagnostic" tests/phase6-headless.test.ts
          }
          git checkout --quiet --detach "$ANCHOR"
          node --experimental-strip-types --test --test-name-pattern="performance: 5000 active economy ticks remain an interactive diagnostic" tests/phase6-headless.test.ts >/dev/null
          git checkout --quiet --detach "$POST"
          node --experimental-strip-types --test --test-name-pattern="performance: 5000 active economy ticks remain an interactive diagnostic" tests/phase6-headless.test.ts >/dev/null
          for sample in 1 2 3 4 5; do
            if (( sample % 2 == 1 )); then
              run_bench ANCHOR "$sample" "$ANCHOR"
              run_bench POST "$sample" "$POST"
            else
              run_bench POST "$sample" "$POST"
              run_bench ANCHOR "$sample" "$ANCHOR"
            fi
          done
