name: Civic Foundry CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Node 22
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Rust 1.98.0
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy
          rustup default 1.98.0
      - name: Install project dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install atlas rasterizer and browser smoke runtime
        run: |
          python -m pip install playwright==1.55.0 Pillow==11.3.0
          python -m playwright install --with-deps chromium
      - name: Core verification
        run: npm run verify
      - name: Prism format
        working-directory: engine/prism
        run: cargo fmt --all -- --check
      - name: Prism Clippy
        working-directory: engine/prism
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Prism P2A mutation tests
        working-directory: engine/prism
        run: cargo test -p prism-domain --test cadastre_mutation --locked
      - name: Prism workspace tests
        working-directory: engine/prism
        run: cargo test --workspace --locked
      - name: Prism P0 release invariants
        working-directory: engine/prism
        run: cargo test -p prism-core --release --test p0_invariants --locked
      - name: Prism P1 release invariants
        working-directory: engine/prism
        run: cargo test -p prism-core --release --test p1_invariants --locked
      - name: Prism workspace check
        working-directory: engine/prism
        run: cargo check --workspace --all-targets --locked
      - name: Phase 6 browser smoke
        run: npm run test:smoke
      - name: Phase 7 browser smoke
        run: npm run test:smoke:phase7
      - name: Urban Fabric browser smoke
        run: npm run test:smoke:urban-fabric
      - name: Isometric Pass A browser smoke
        run: npm run test:smoke:isometric
      - name: Isometric Pass A visual smoke
        run: python tests/smoke/isometric_visual_smoke.py

  prism-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Rust 1.98.0
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy
          rustup default 1.98.0
      - name: Prism format
        working-directory: engine/prism
        run: cargo fmt --all -- --check
      - name: Prism Clippy
        working-directory: engine/prism
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Prism P2A mutation tests
        working-directory: engine/prism
        run: cargo test -p prism-domain --test cadastre_mutation --locked
      - name: Prism workspace tests
        working-directory: engine/prism
        run: cargo test --workspace --locked
      - name: Prism P0 release invariants
        working-directory: engine/prism
        run: cargo test -p prism-core --release --test p0_invariants --locked
      - name: Prism P1 release invariants
        working-directory: engine/prism
        run: cargo test -p prism-core --release --test p1_invariants --locked
      - name: Prism workspace check
        working-directory: engine/prism
        run: cargo check --workspace --all-targets --locked

  prism-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Rust 1.98.0
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy
          rustup default 1.98.0
      - name: Verify native Prism host
        shell: pwsh
        run: |
          cargo test --manifest-path engine/prism/Cargo.toml -p prism-host --test bootstrap_smoke --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $output = cargo run --manifest-path engine/prism/Cargo.toml -p prism-host --release --locked --quiet
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($output -ne "PRISM_BOOTSTRAP version=0.1.0 entity_generation=1 alignment=64 compiled_jobs=2") {
            throw "Unexpected Prism bootstrap output: $output"
          }
