name: Civic Foundry CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Node 22
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
          cache: npm
      - name: Install project dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Fast verification
        run: npm run verify:fast
      - name: Install atlas rasterizer and browser smoke runtime
        run: |
          python -m pip install playwright==1.55.0 Pillow==11.3.0
          python -m playwright install --with-deps chromium
      - name: Asset source validation
        run: npm run assets:check
      - name: Production build
        run: npm run build
      - name: Portable browser and visual acceptance
        run: npm run test:smoke:portable
      - name: Preserve smoke diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: civic-foundry-smoke-diagnostics-${{ github.sha }}
          path: test-artifacts/
          if-no-files-found: ignore
          retention-days: 7
