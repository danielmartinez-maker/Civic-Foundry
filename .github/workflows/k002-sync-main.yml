name: K002 sync main one-shot

on:
  push:
    branches:
      - feature/k002-domain-event-journal-cpp
    paths:
      - .github/workflows/k002-sync-main.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/k002-domain-event-journal-cpp
          fetch-depth: 0

      - name: Merge current main and reconcile K001/K002 overlaps
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          set +e
          git merge --no-ff --no-commit origin/main
          set -e
          git checkout origin/main -- cpp/engine/include/civic/core/Kernel.hpp
          git checkout origin/main -- cpp/engine/src/core/Kernel.cpp
          git checkout origin/main -- cpp/tests/core/CoreTests.cpp
          git checkout origin/main -- docs/cpp/TS_REWRITE_LEDGER.json
          echo '' | base64 -d > /tmp/k002-sync.js
          node /tmp/k002-sync.js
          git add cpp/engine/include/civic/core/Kernel.hpp cpp/engine/src/core/Kernel.cpp cpp/tests/core/CoreTests.cpp docs/cpp/TS_REWRITE_LEDGER.json
          git add cpp/engine/src/core/NativeEngine.cpp cpp/tests/parity/ParityTests.cpp || true
          if git diff --name-only --diff-filter=U | grep -q .; then
            git diff --name-only --diff-filter=U
            exit 1
          fi
          git diff --check --cached
          node scripts/cpp/ts-rewrite-ledger.mjs verify
          git commit -m "Merge main into K002 domain event journal rewrite"
          git push origin HEAD:feature/k002-domain-event-journal-cpp
