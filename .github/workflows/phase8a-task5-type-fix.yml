name: Phase8A Task5 Type Fix

on:
  push:
    branches: [phase8a-utility-networks]
    paths: [.github/workflows/phase8a-task5-type-fix.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase8a-utility-networks
          fetch-depth: 0
      - name: Apply narrow TypeScript compatibility fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/simulation/utilities/UtilitySystem.ts')
          s = p.read_text()
          old = """export type UtilityBuildingService = Readonly<{\n  power: number;\n  water: number;\n  powerDelivered: number;\n  waterDelivered: number;\n  waterPressureEligible: boolean;\n  waterPressureMargin: number;\n  limitingReason?: DevelopmentUtilityHeadroom['limitingReason'];\n}>;"""
          new = """export type UtilityBuildingService = Readonly<{\n  power: number;\n  water: number;\n  powerDelivered?: number;\n  waterDelivered?: number;\n  waterPressureEligible?: boolean;\n  waterPressureMargin?: number;\n  limitingReason?: DevelopmentUtilityHeadroom['limitingReason'];\n}>;"""
          if old not in s:
              raise SystemExit('UtilityBuildingService seam not found')
          s = s.replace(old, new, 1)
          old2 = """  private lastPowerNetwork?: PowerNetworkSnapshot;\n  private lastWaterNetwork?: WaterNetworkSnapshot;\n  private lastSnapshot?: UtilitySnapshot;"""
          new2 = """  private lastPowerNetwork: PowerNetworkSnapshot | undefined;\n  private lastWaterNetwork: WaterNetworkSnapshot | undefined;\n  private lastSnapshot: UtilitySnapshot | undefined;"""
          if old2 not in s:
              raise SystemExit('cache field seam not found')
          s = s.replace(old2, new2, 1)
          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/simulation/utilities/UtilitySystem.ts
          git commit -m "fix: preserve legacy utility snapshot typing [phase8a-task5]"
          git push origin HEAD:phase8a-utility-networks
