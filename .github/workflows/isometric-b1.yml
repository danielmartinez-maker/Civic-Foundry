name: Isometric Pass B1 CI

on:
  push:
    branches: [feature/isometric-pass-b1-urban-depth]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  b1-targeted:
    name: Isometric Pass B1 Targeted CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Node 22
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Install project dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Pass B1 unit tests
        shell: bash
        run: |
          files=(tests/isometric-assets.test.ts)
          for candidate in tests/isometric-b1-*.test.ts; do
            if [ -f "$candidate" ]; then files+=("$candidate"); fi
          done
          node --experimental-strip-types --test "${files[@]}"
      - name: Repository typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Asset source validation
        run: npm run assets:check
      - name: Install atlas rasterizer and browser smoke runtime
        run: |
          python -m pip install playwright==1.55.0 Pillow==11.3.0
          python -m playwright install --with-deps chromium
      - name: Production build
        run: npm run build
      - name: Pass A interaction regression smoke
        run: npm run test:smoke:isometric
      - name: Pass B1 visual smoke
        run: python tests/smoke/isometric_b1_visual_smoke.py
