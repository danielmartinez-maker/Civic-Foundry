name: Isometric Pass B1 Targeted CI

on:
  push:
    branches: [feature/isometric-pass-b1-urban-depth]
  pull_request:
    branches: [feature/urban-fabric-2.0]

permissions:
  contents: read

jobs:
  b1-targeted:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout B1 head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install project dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Install pinned TypeScript compiler
        run: npm install --global typescript@5.8.3
      - name: Pass B1 unit tests
        run: |
          files=(tests/isometric-assets.test.ts)
          for candidate in tests/isometric-b1-*.test.ts; do
            if [ -f "$candidate" ]; then files+=("$candidate"); fi
          done
          node --experimental-strip-types --test "${files[@]}"
      - name: B1 typecheck delta against stacked parent
        shell: bash
        run: |
          set +e
          tsc -p tsconfig.json --noEmit --pretty false > /tmp/b1-head-typecheck.log 2>&1
          head_status=$?
          set -e

          stack_merge="$(git rev-list --merges --first-parent -n 1 HEAD)"
          if [ -z "$stack_merge" ]; then
            echo "Unable to locate the B1 parent merge commit."
            exit 1
          fi
          base_ref="$(git rev-parse "${stack_merge}^2")"
          echo "Pinned stacked parent: $base_ref"

          parent_dir="$(mktemp -d)"
          git worktree add --detach "$parent_dir" "$base_ref"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$parent_dir/node_modules"

          set +e
          (cd "$parent_dir" && tsc -p tsconfig.json --noEmit --pretty false > /tmp/b1-parent-typecheck.log 2>&1)
          parent_status=$?
          set -e

          echo "Parent typecheck exit: $parent_status"
          echo "B1 head typecheck exit: $head_status"

          if [ "$parent_status" -eq 0 ] && [ "$head_status" -ne 0 ]; then
            echo "B1 introduces TypeScript diagnostics on a green parent."
            cat /tmp/b1-head-typecheck.log
            exit 1
          fi

          if [ "$parent_status" -ne 0 ] && [ "$head_status" -eq 0 ]; then
            echo "B1 head clears the parent TypeScript diagnostics."
            exit 0
          fi

          if ! diff -u /tmp/b1-parent-typecheck.log /tmp/b1-head-typecheck.log; then
            echo "B1 changes the stacked parent TypeScript diagnostic set."
            exit 1
          fi

          echo "B1 introduces no TypeScript diagnostics beyond the stacked parent baseline."
      - name: Repository-wide typecheck status
        continue-on-error: true
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Asset source validation
        run: npm run assets:check
      - name: Install atlas rasterizer and smoke runtime
        run: |
          python -m pip install playwright==1.55.0 Pillow==11.3.0
          python -m playwright install --with-deps chromium
      - name: Production smoke build on parent compiler baseline
        shell: bash
        run: |
          rm -rf dist
          set +e
          tsc -p tsconfig.json --noEmitOnError false --pretty false
          compiler_status=$?
          set -e
          if [ "$compiler_status" -ne 0 ]; then
            echo "Compiler emitted with the inherited parent diagnostics verified by the delta gate above."
          fi
          test -f dist/src/main.js
          cp index.html dist/index.html
          cp src/styles.css dist/styles.css
          mkdir -p dist/vendor
          cp node_modules/clipper2-ts/dist/clipper2.min.mjs dist/vendor/clipper2.min.mjs
          python tools/render_isometric_atlases.py
      - name: Pass A interaction regression smoke
        run: npm run test:smoke:isometric
      - name: Pass B1 visual smoke
        run: python tests/smoke/isometric_b1_visual_smoke.py
