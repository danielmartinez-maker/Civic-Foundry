name: Phase 7 Housing Sync Fix

on:
  push:
    branches: [phase7-tenure-relocation]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[phase7-sync-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase7-tenure-relocation
          fetch-depth: 0
      - name: Patch stale-ledger synchronization
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/simulation/core/SimulationCore.ts')
          text = p.read_text()
          old_policy = '''    this.refreshHousingTenure();\n    this.housingRelocation.refreshSnapshot(this.population.population, this.housingTenureSnapshot.options);\n    this.refreshHousingChoice();\n    this.refreshRedevelopmentPressure();\n    this.refreshRedevelopmentExecution();\n    return state;\n'''
          new_policy = '''    this.refreshHousingTenure();\n    this.syncHousingPopulationWithoutVoluntaryMoves();\n    this.refreshHousingChoice();\n    this.refreshRedevelopmentPressure();\n    this.refreshRedevelopmentExecution();\n    return state;\n'''
          if text.count(old_policy) != 1:
              raise SystemExit(f'policy seam count={text.count(old_policy)}')
          text = text.replace(old_policy, new_policy, 1)

          old_dev = '''  private evaluateDevelopmentMarket(): void {\n    this.refreshLandHousingMarket();\n    this.refreshHousingTenure();\n    this.housingRelocation.refreshSnapshot(this.population.population, this.housingTenureSnapshot.options);\n    this.refreshHousingChoice();\n'''
          new_dev = '''  private evaluateDevelopmentMarket(): void {\n    this.refreshLandHousingMarket();\n    this.refreshHousingTenure();\n    this.syncHousingPopulationWithoutVoluntaryMoves();\n    this.refreshHousingChoice();\n'''
          if text.count(old_dev) != 1:
              raise SystemExit(f'development seam count={text.count(old_dev)}')
          text = text.replace(old_dev, new_dev, 1)

          marker = '''  private refreshHousingChoice(): HousingChoiceSnapshot {\n'''
          helper = '''  private syncHousingPopulationWithoutVoluntaryMoves(): HousingRelocationSnapshot {\n    const state = this.housingRelocation.snapshotState();\n    const represented = state.allocations.reduce((sum, item) => sum + item.residents, 0)\n      + state.unplaced.reduce((sum, item) => sum + item.residents, 0);\n    if (Math.abs(represented - this.population.population) > 1e-6) {\n      return this.housingRelocation.reconcile({\n        population: this.population.population,\n        options: this.housingTenureSnapshot.options,\n        allowVoluntaryMoves: false,\n      });\n    }\n    return this.housingRelocation.refreshSnapshot(this.population.population, this.housingTenureSnapshot.options);\n  }\n\n'''
          if text.count(marker) != 1:
              raise SystemExit(f'housing helper marker count={text.count(marker)}')
          text = text.replace(marker, helper + marker, 1)
          p.write_text(text)
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/simulation/core/SimulationCore.ts
          git diff --cached --check
          git commit -m "fix: synchronize stale housing population before derived refresh [phase7-sync-fix]"
          git push origin HEAD:phase7-tenure-relocation
