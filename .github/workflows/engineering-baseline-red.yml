name: Engineering Baseline RED

on:
  push:
    branches: [chore/engineering-baseline-v1]

permissions:
  contents: read

jobs:
  red-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run engineering contract tests
        run: >-
          node --experimental-strip-types --test
          tests/repository_policy.test.ts
          tests/architecture_policy.test.ts
          tests/build_script.test.ts
          tests/asset_policy.test.ts
