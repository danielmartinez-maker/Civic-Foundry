name: Phase 7 Land Housing Smoke

on:
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned TypeScript compiler
        run: npm install --global typescript@5.8.3
      - name: Build
        run: npm run build
      - name: Install Playwright
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Phase 7 smoke
        run: npm run test:smoke:phase7
