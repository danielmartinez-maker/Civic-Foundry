name: Prettier diagnostic

on:
  push:
    branches:
      - feature/desktop-gpu-runtime

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Print canonical scripts/build.mjs
        run: npx prettier scripts/build.mjs
