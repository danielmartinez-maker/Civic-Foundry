name: K008 reconcile main

on:
  push:
    branches:
      - "feat/k008-system-scheduler-cpp-rewrite"

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Node 22
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
          cache: npm
      - name: Native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libjson-c-dev libgtest-dev
          python -m pip install --upgrade "cmake>=3.30,<5"
      - name: Reconcile current main preserving K005 and K008
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python scripts/cpp/k008_reconcile.py save
          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e
          if [ "$merge_status" -ne 0 ]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U | sort)
            printf 'Conflicts: %s\n' "${conflicts[*]}"
            expected=(
              "cpp/tests/core/CoreTests.cpp"
              "cpp/tests/parity/ParityTests.cpp"
            )
            if [ "${conflicts[*]}" != "${expected[*]}" ]; then
              echo "Unexpected reconciliation conflict set" >&2
              exit 1
            fi
            git checkout --theirs -- cpp/tests/core/CoreTests.cpp cpp/tests/parity/ParityTests.cpp
            python scripts/cpp/k008_reconcile.py resolve
            git add cpp/tests/core/CoreTests.cpp cpp/tests/parity/ParityTests.cpp docs/cpp/TS_REWRITE_LEDGER.json
          fi
          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "Unresolved merge conflicts remain" >&2
            git diff --name-only --diff-filter=U
            exit 1
          fi
          git diff --check
          git commit -m "Merge current main into K008 scheduler rewrite"
      - name: Focused scheduler gate twice
        run: |
          node scripts/cpp/run-native-round.mjs --regex "SchedulerContracts|SchedulerParity"
          node scripts/cpp/run-native-round.mjs --regex "SchedulerContracts|SchedulerParity"
      - name: Full native and control-plane gates
        run: |
          node scripts/cpp/run-native-round.mjs
          npm ci --ignore-scripts --no-audit --no-fund
          npm run cpp:ts-ledger:verify
          npm run test:cpp-ts-count-guard
          npm run cpp:ts-count:guard
          npm run test:cpp-parity-evidence
          npm run test:cpp-authority-gate
          npm run cpp:authority:verify
          git diff --check origin/main...HEAD
      - name: Remove temporary reconciliation helpers and push
        run: |
          git rm .github/workflows/k008-reconcile-main.yml scripts/cpp/k008_reconcile.py
          git commit -m "chore(k008): remove reconciliation helpers"
          git push origin HEAD:feat/k008-system-scheduler-cpp-rewrite
