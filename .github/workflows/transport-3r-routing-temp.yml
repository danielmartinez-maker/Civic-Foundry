name: Transport 3R routing cutover

on:
  push:
    branches:
      - feature/stack-2-transportation-3r-completion

permissions:
  contents: write

jobs:
  routing:
    if: ${{ !contains(github.event.head_commit.message, '[3r-routing-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: feature/stack-2-transportation-3r-completion
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: python scripts/transport3r-routing-cutover.py
      - run: npm run format
      - name: Commit routing cutover and self-delete
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/transport-3r-routing-temp.yml scripts/transport3r-routing-cutover.py
          git add src/simulation/core src/simulation/mobility src/simulation/services src/simulation/transportation tests
          git commit -m "feat(transportation): cut routing and mode choice to 3R [3r-routing-done]"
          git push origin HEAD:feature/stack-2-transportation-3r-completion
