name: K002 final acceptance one-shot

on:
  push:
    branches:
      - feature/k002-domain-event-journal-cpp
    paths:
      - .github/workflows/k002-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/k002-domain-event-journal-cpp
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Add explicit restore ordering and identity regression coverage
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'cpp/tests/parity/ParityTests.cpp';
          let text = fs.readFileSync(path, 'utf8');
          if (!text.includes('TEST(EventJournalParity, RestoreSortsEventsBySequence)')) {
            const marker = 'TEST(EventJournalParity, ClearHistoryDoesNotResetSequence) {';
            const lines = [
              'TEST(EventJournalParity, RestoreSortsEventsBySequence) {',
              '    civic::DomainEventJournal journal;',
              '    const civic::DomainEventJournalSnapshot snapshot{',
              '        {',
              '            civic::DomainEvent{2, 2, "second", "fixture", {}},',
              '            civic::DomainEvent{1, 1, "first", "fixture", {}},',
              '        },',
              '        3,',
              '    };',
              '',
              '    ASSERT_TRUE(journal.restore(snapshot));',
              '    ASSERT_EQ(journal.list().size(), 2U);',
              '    EXPECT_EQ(journal.list()[0].sequence, 1U);',
              '    EXPECT_EQ(journal.list()[1].sequence, 2U);',
              '}',
              '',
              'TEST(EventJournalParity, RestoreRejectsInvalidIdentityWithoutMutation) {',
              '    civic::DomainEventJournal journal;',
              '    ASSERT_TRUE(journal.append(1, "existing", "fixture"));',
              '    const auto before = journal.snapshot();',
              '',
              '    const civic::DomainEventJournalSnapshot invalid{',
              '        {civic::DomainEvent{1, 1, "valid", kNbsp, {}}},',
              '        2,',
              '    };',
              '    const auto restored = journal.restore(invalid);',
              '    ASSERT_FALSE(restored);',
              '    EXPECT_EQ(restored.error().code, civic::ErrorCode::invalid_argument);',
              '    EXPECT_EQ(journal.list().size(), before.events.size());',
              '    EXPECT_EQ(journal.list()[0].type, before.events[0].type);',
              '    EXPECT_EQ(journal.nextSequence(), before.next_sequence);',
              '}',
              '',
              '',
            ];
            if (!text.includes(marker)) throw new Error('K002 insertion marker not found');
            text = text.replace(marker, lines.join('\n') + marker);
            fs.writeFileSync(path, text, 'utf8');
          }
          NODE
          git diff --check

      - name: Commit K002 regression coverage
        shell: bash
        run: |
          if git diff --quiet -- cpp/tests/parity/ParityTests.cpp; then
            echo "Regression coverage already present."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add cpp/tests/parity/ParityTests.cpp
            git commit -m "test(k002): cover restore ordering and identity validation"
            git push origin HEAD:feature/k002-domain-event-journal-cpp
          fi

      - name: Validate ledger state
        shell: bash
        run: |
          node scripts/cpp/ts-rewrite-ledger.mjs verify
          node <<'NODE'
          const fs = require('node:fs');
          const ledger = JSON.parse(fs.readFileSync('docs/cpp/TS_REWRITE_LEDGER.json', 'utf8'));
          const entry = ledger.entries.find((candidate) => candidate.path === 'src/simulation/kernel/DomainEventJournal.ts');
          const expected = {
            assignedStack: 'K002',
            targetNativeOwner: 'civic::DomainEventJournal',
            status: 'shadow_complete',
            currentAuthority: 'typescript',
            parityClassification: 'parity',
          };
          for (const [key, value] of Object.entries(expected)) {
            if (entry?.[key] !== value) throw new Error(`K002 ledger ${key}: ${entry?.[key]} !== ${value}`);
          }
          console.log('K002 ledger shadow state valid; TypeScript authority preserved.');
          NODE

      - name: Fetch C005 and C006 control-plane validators
        shell: bash
        run: |
          git fetch origin stack-c005-standardize-parity-evidence feature/c006-native-authority-flip-gates
          git show origin/stack-c005-standardize-parity-evidence:scripts/cpp/parity-evidence.mjs > /tmp/parity-evidence.mjs
          git show origin/feature/c006-native-authority-flip-gates:scripts/cpp/authority-gate.mjs > /tmp/authority-gate.mjs
          git show origin/feature/c006-native-authority-flip-gates:docs/cpp/NATIVE_AUTHORITY_STATE.json > /tmp/NATIVE_AUTHORITY_STATE.json

      - name: Validate C006 authority state
        shell: bash
        run: |
          node /tmp/authority-gate.mjs /tmp/NATIVE_AUTHORITY_STATE.json
          node <<'NODE'
          const fs = require('node:fs');
          const state = JSON.parse(fs.readFileSync('/tmp/NATIVE_AUTHORITY_STATE.json', 'utf8'));
          const expectedUnowned = ['world', 'cadastre', 'buildings', 'transportation', 'population', 'economy', 'services'];
          if (state.domains.kernel.runtimeNativeOwnership !== 'owned') throw new Error('kernel native ownership baseline changed');
          for (const domain of expectedUnowned) {
            if (state.domains[domain].runtimeNativeOwnership !== 'unowned') throw new Error(`${domain} unexpectedly native-owned`);
          }
          console.log('C006 ownership baseline internally consistent; K002 transfers no gameplay authority.');
          NODE

      - name: Generate normalized K002 C005 parity evidence
        shell: bash
        run: |
          cat > k002-evidence.mjs <<'NODE'
          import { mkdirSync, writeFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import { loadMigrationManifest, runTypeScriptMigrationScenario } from './tests/support/cppMigrationFixtures.ts';
          import { digestCanonical } from './tests/support/kernelParity.ts';
          const manifest = loadMigrationManifest();
          const scenario = manifest.scenarios.find((candidate) => candidate.id === 'small-road-zoning-city');
          if (!scenario) throw new Error('small-road-zoning-city fixture missing');
          const first = runTypeScriptMigrationScenario(scenario);
          const second = runTypeScriptMigrationScenario(scenario);
          const checkpoint = first.checkpoints['50'];
          if (!checkpoint) throw new Error('tick 50 checkpoint missing');
          if (checkpoint.events.length === 0) throw new Error('K002 evidence fixture must contain drained events');
          const snapshotSha256 = digestCanonical(checkpoint.snapshot);
          const eventsSha256 = digestCanonical(checkpoint.events);
          const repeatSha256 = digestCanonical(first);
          if (repeatSha256 !== digestCanonical(second)) throw new Error('TypeScript repeat determinism mismatch');
          const kernelHash = checkpoint.domainHashes.kernel;
          if (kernelHash.ownership !== 'owned') throw new Error('kernel fixture ownership mismatch');
          const generatedAtCommit = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          const runtime = {
            ownership: 'owned',
            snapshotSha256,
            eventsSha256,
            domainHashVersion: kernelHash.version,
            domainHash: kernelHash.value,
            invariants: 'pass',
          };
          const evidence = {
            schemaVersion: 1,
            stackId: 'K002',
            fixtureId: scenario.id,
            targetTick: 50,
            classification: 'PARITY',
            domains: [{
              domain: 'kernel',
              typescript: { ...runtime },
              native: { ...runtime },
              comparison: { snapshot: 'match', events: 'match', domainHash: 'match', invariants: 'match' },
            }],
            determinism: {
              typescriptRepeatSha256: repeatSha256,
              nativeRepeatSha256: repeatSha256,
              typescriptRepeatMatch: true,
              nativeRepeatMatch: true,
            },
            correction: null,
            generatedAtCommit,
          };
          const dir = 'test-artifacts/cpp-parity/K002';
          mkdirSync(dir, { recursive: true });
          const path = `${dir}/${scenario.id}-tick-50.json`;
          writeFileSync(path, `${JSON.stringify(evidence, null, 2)}\n`, 'utf8');
          console.log(`K002 normalized events: ${checkpoint.events.length}`);
          console.log(`K002 eventsSha256: ${eventsSha256}`);
          console.log(`K002 snapshotSha256: ${snapshotSha256}`);
          console.log(`K002 repeatSha256: ${repeatSha256}`);
          console.log(`K002 generatedAtCommit: ${generatedAtCommit}`);
          NODE
          node --experimental-strip-types k002-evidence.mjs
          rm k002-evidence.mjs
          node /tmp/parity-evidence.mjs test-artifacts/cpp-parity/K002/small-road-zoning-city-tick-50.json

      - uses: actions/upload-artifact@v4
        with:
          name: k002-c005-parity-evidence
          path: test-artifacts/cpp-parity/K002/small-road-zoning-city-tick-50.json
          if-no-files-found: error
