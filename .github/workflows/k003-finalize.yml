name: K003 final acceptance one-shot

on:
  push:
    branches:
      - feat/k003-invariant-runner-cpp-rewrite
    paths:
      - .github/workflows/k003-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout K003 branch
        uses: actions/checkout@v7.0.1
        with:
          ref: feat/k003-invariant-runner-cpp-rewrite
          fetch-depth: 0

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Define native paths
        shell: bash
        run: |
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"
          echo "VCPKG_DEFAULT_BINARY_CACHE=$RUNNER_TEMP/vcpkg-cache" >> "$GITHUB_ENV"

      - name: Record K003 ledger shadow state
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'docs/cpp/TS_REWRITE_LEDGER.json';
          const ledger = JSON.parse(fs.readFileSync(path, 'utf8'));
          const entry = ledger.entries.find((candidate) => candidate.path === 'src/simulation/kernel/InvariantRunner.ts');
          if (!entry || entry.inventoryId !== 'CF-TS-0097') throw new Error('K003 ledger entry identity mismatch');
          entry.assignedStack = 'K003';
          entry.targetNativeOwner = 'civic::InvariantRunner';
          entry.nativeTestOwner = 'cpp/tests/parity/ParityTests.cpp';
          entry.status = 'shadow_complete';
          entry.currentAuthority = 'typescript';
          entry.parityClassification = 'parity';
          entry.cutoverDependencies = [];
          fs.writeFileSync(path, `${JSON.stringify(ledger, null, 2)}\n`, 'utf8');
          NODE
          node scripts/cpp/ts-rewrite-ledger.mjs verify
          git diff --check

      - name: Validate exact K003 ledger fields
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const ledger = JSON.parse(fs.readFileSync('docs/cpp/TS_REWRITE_LEDGER.json', 'utf8'));
          const entry = ledger.entries.find((candidate) => candidate.path === 'src/simulation/kernel/InvariantRunner.ts');
          const expected = {
            inventoryId: 'CF-TS-0097',
            assignedStack: 'K003',
            targetNativeOwner: 'civic::InvariantRunner',
            nativeTestOwner: 'cpp/tests/parity/ParityTests.cpp',
            status: 'shadow_complete',
            currentAuthority: 'typescript',
            parityClassification: 'parity',
          };
          for (const [key, value] of Object.entries(expected)) {
            if (entry?.[key] !== value) throw new Error(`K003 ledger ${key}: ${entry?.[key]} !== ${value}`);
          }
          if (entry.cutoverDependencies.length !== 0) throw new Error('K003 must not transfer gameplay authority');
          console.log('K003 ledger shadow state valid; TypeScript authority preserved.');
          NODE

      - name: Cache vcpkg binary artifacts
        uses: actions/cache@v6.1.0
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-${{ runner.os }}-k003-${{ hashFiles('cpp/vcpkg.json') }}

      - name: Bootstrap pinned vcpkg
        shell: bash
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          git clone --depth 1 --branch 2026.07.29 https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          echo "CMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" >> "$GITHUB_ENV"

      - name: K003 focused invariant parity gate
        run: node scripts/cpp/run-native-round.mjs --regex "InvariantParity|InvariantContracts"

      - name: K003 UTF-16 ordering regression gate
        run: node scripts/cpp/run-native-round.mjs --regex "InvariantContracts|Utf16"

      - name: Fetch C005 and C006 control-plane validators
        shell: bash
        run: |
          git fetch origin stack-c005-standardize-parity-evidence feature/c006-native-authority-flip-gates
          git show origin/stack-c005-standardize-parity-evidence:scripts/cpp/parity-evidence.mjs > /tmp/parity-evidence.mjs
          git show origin/feature/c006-native-authority-flip-gates:scripts/cpp/authority-gate.mjs > /tmp/authority-gate.mjs
          git show origin/feature/c006-native-authority-flip-gates:docs/cpp/NATIVE_AUTHORITY_STATE.json > /tmp/NATIVE_AUTHORITY_STATE.json

      - name: Validate C006 authority state
        shell: bash
        run: |
          node /tmp/authority-gate.mjs /tmp/NATIVE_AUTHORITY_STATE.json
          node <<'NODE'
          const fs = require('node:fs');
          const state = JSON.parse(fs.readFileSync('/tmp/NATIVE_AUTHORITY_STATE.json', 'utf8'));
          if (state.domains.kernel.runtimeNativeOwnership !== 'owned') throw new Error('kernel native ownership baseline changed');
          const expectedUnowned = ['world', 'cadastre', 'buildings', 'transportation', 'population', 'economy', 'services'];
          for (const domain of expectedUnowned) {
            if (state.domains[domain].runtimeNativeOwnership !== 'unowned') throw new Error(`${domain} unexpectedly native-owned`);
          }
          console.log('C006 ownership baseline internally consistent; K003 transfers no gameplay authority.');
          NODE

      - name: Generate TypeScript invariant semantic fixture
        shell: bash
        run: |
          cat > k003-ts-evidence.ts <<'TS'
          import { InvariantRunner } from './src/simulation/kernel/InvariantRunner.ts';
          import type { KernelStepContext } from './src/simulation/kernel/KernelTypes.ts';

          const context = {} as KernelStepContext;
          const supplementary = '\u{10000}';
          const privateBmp = '\uE000';

          const orderRunner = new InvariantRunner();
          const order: string[] = [];
          orderRunner.register({ id: privateBmp, cadence: { every: 1 }, check: () => { order.push(privateBmp); } });
          orderRunner.register({ id: supplementary, cadence: { every: 1 }, check: () => { order.push(supplementary); } });
          orderRunner.runDue(0, context);
          const ids = orderRunner.list().map((entry) => entry.id);

          const cadenceRunner = new InvariantRunner();
          const ticks: number[] = [];
          cadenceRunner.register({ id: 'periodic', cadence: { every: 3, offset: 2 }, check: (ctx) => { ticks.push(ctx.tick); } });
          for (let tick = 0; tick <= 8; tick += 1) cadenceRunner.runDue(tick, { ...context, tick } as KernelStepContext);

          const failureRunner = new InvariantRunner();
          failureRunner.register({ id: 'broken', cadence: { every: 1 }, check: () => { throw new Error('underlying detail'); } });
          let failure = '';
          try {
            failureRunner.runDue(7, context);
          } catch (error) {
            failure = error instanceof Error ? error.message : String(error);
          }

          let originalCalls = 0;
          let mutatedCalls = 0;
          const definition = {
            id: 'stable',
            cadence: { every: 2, offset: 1 },
            check: () => { originalCalls += 1; },
          };
          const copyRunner = new InvariantRunner();
          copyRunner.register(definition);
          definition.id = 'mutated';
          definition.cadence = { every: 1, offset: 0 };
          definition.check = () => { mutatedCalls += 1; };
          copyRunner.runDue(0, context);
          copyRunner.runDue(1, context);
          const copiedIds = copyRunner.list().map((entry) => entry.id);

          const output = { ids, order, ticks, failure, copiedIds, originalCalls, mutatedCalls };
          const expected = {
            ids: [supplementary, privateBmp],
            order: [supplementary, privateBmp],
            ticks: [2, 5, 8],
            failure: 'invariant failed [broken] at tick 7: underlying detail',
            copiedIds: ['stable'],
            originalCalls: 1,
            mutatedCalls: 0,
          };
          if (JSON.stringify(output) !== JSON.stringify(expected)) {
            throw new Error(`TypeScript K003 fixture mismatch: ${JSON.stringify(output)}`);
          }
          process.stdout.write(JSON.stringify(output));
          TS
          node --experimental-strip-types k003-ts-evidence.ts > /tmp/k003-ts-1.json
          node --experimental-strip-types k003-ts-evidence.ts > /tmp/k003-ts-2.json

      - name: Generate native invariant semantic fixture
        shell: bash
        run: |
          cat > k003-native-evidence.cpp <<'CPP'
          #include <civic/core/Kernel.hpp>
          #include <cstdint>
          #include <iostream>
          #include <sstream>
          #include <string>
          #include <vector>

          int main() {
              const std::string supplementary{"\xF0\x90\x80\x80"};
              const std::string privateBmp{"\xEE\x80\x80"};

              civic::InvariantRunner orderRunner;
              std::vector<std::string> order;
              if (!orderRunner.registerInvariant({privateBmp, {1, 0}, [&](std::uint64_t) -> civic::Result<void> { order.push_back(privateBmp); return {}; }})) return 10;
              if (!orderRunner.registerInvariant({supplementary, {1, 0}, [&](std::uint64_t) -> civic::Result<void> { order.push_back(supplementary); return {}; }})) return 11;
              if (!orderRunner.runDue(0)) return 12;
              const auto ids = orderRunner.listIds();

              civic::InvariantRunner cadenceRunner;
              std::vector<std::uint64_t> ticks;
              if (!cadenceRunner.registerInvariant({"periodic", {3, 2}, [&](std::uint64_t tick) -> civic::Result<void> { ticks.push_back(tick); return {}; }})) return 13;
              for (std::uint64_t tick = 0; tick <= 8; ++tick) if (!cadenceRunner.runDue(tick)) return 14;

              civic::InvariantRunner failureRunner;
              if (!failureRunner.registerInvariant({"broken", {1, 0}, [](std::uint64_t) -> civic::Result<void> {
                  return std::unexpected(civic::make_error(civic::ErrorCode::invalid_state, "underlying detail"));
              }})) return 15;
              const auto failed = failureRunner.runDue(7);
              if (failed || failed.error().code != civic::ErrorCode::invariant_failure) return 16;
              const auto failure = failed.error().message;

              int originalCalls = 0;
              int mutatedCalls = 0;
              civic::InvariantDefinition definition{
                  "stable",
                  {2, 1},
                  [&](std::uint64_t) -> civic::Result<void> { ++originalCalls; return {}; }
              };
              civic::InvariantRunner copyRunner;
              if (!copyRunner.registerInvariant(definition)) return 17;
              definition.id = "mutated";
              definition.cadence = {1, 0};
              definition.check = [&](std::uint64_t) -> civic::Result<void> { ++mutatedCalls; return {}; };
              if (!copyRunner.runDue(0) || !copyRunner.runDue(1)) return 18;
              const auto copiedIds = copyRunner.listIds();

              if (ids != std::vector<std::string>{supplementary, privateBmp}) return 19;
              if (order != std::vector<std::string>{supplementary, privateBmp}) return 20;
              if (ticks != std::vector<std::uint64_t>{2, 5, 8}) return 21;
              if (failure != "invariant failed [broken] at tick 7: underlying detail") return 22;
              if (copiedIds != std::vector<std::string>{"stable"} || originalCalls != 1 || mutatedCalls != 0) return 23;

              std::ostringstream json;
              json << "{\"ids\":[\"" << supplementary << "\",\"" << privateBmp << "\"],";
              json << "\"order\":[\"" << supplementary << "\",\"" << privateBmp << "\"],";
              json << "\"ticks\":[2,5,8],";
              json << "\"failure\":\"" << failure << "\",";
              json << "\"copiedIds\":[\"stable\"],";
              json << "\"originalCalls\":" << originalCalls << ",";
              json << "\"mutatedCalls\":" << mutatedCalls << "}";
              std::cout << json.str();
              return 0;
          }
          CPP
          g++ -std=c++23 -Icpp/engine/include k003-native-evidence.cpp cpp/engine/src/core/Kernel.cpp -o /tmp/k003-native-evidence
          /tmp/k003-native-evidence > /tmp/k003-native-1.json
          /tmp/k003-native-evidence > /tmp/k003-native-2.json

      - name: Generate and validate normalized K003 C005 parity evidence
        shell: bash
        run: |
          cat > k003-evidence.mjs <<'NODE'
          import { mkdirSync, readFileSync, writeFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import { digestCanonical } from './tests/support/kernelParity.ts';

          const ts1 = JSON.parse(readFileSync('/tmp/k003-ts-1.json', 'utf8'));
          const ts2 = JSON.parse(readFileSync('/tmp/k003-ts-2.json', 'utf8'));
          const native1 = JSON.parse(readFileSync('/tmp/k003-native-1.json', 'utf8'));
          const native2 = JSON.parse(readFileSync('/tmp/k003-native-2.json', 'utf8'));
          const canonicalTs = digestCanonical(ts1);
          const canonicalNative = digestCanonical(native1);
          const tsRepeat = digestCanonical(ts2);
          const nativeRepeat = digestCanonical(native2);
          if (canonicalTs !== canonicalNative) throw new Error(`K003 TS/native semantic mismatch: ${canonicalTs} !== ${canonicalNative}`);
          if (canonicalTs !== tsRepeat) throw new Error('K003 TypeScript repeat determinism mismatch');
          if (canonicalNative !== nativeRepeat) throw new Error('K003 native repeat determinism mismatch');

          const eventProjection = (value) => ({ order: value.order, ticks: value.ticks, failure: value.failure });
          const tsEvents = digestCanonical(eventProjection(ts1));
          const nativeEvents = digestCanonical(eventProjection(native1));
          if (tsEvents !== nativeEvents) throw new Error('K003 event/diagnostic projection mismatch');

          const domainHash = BigInt(`0x${canonicalTs.slice(0, 16)}`).toString();
          const generatedAtCommit = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          const evidence = {
            schemaVersion: 1,
            stackId: 'K003',
            fixtureId: 'invariant-runner-semantic-parity',
            targetTick: 8,
            classification: 'PARITY',
            domains: [{
              domain: 'kernel',
              typescript: {
                ownership: 'owned',
                snapshotSha256: canonicalTs,
                eventsSha256: tsEvents,
                domainHashVersion: 1,
                domainHash,
                invariants: 'pass',
              },
              native: {
                ownership: 'owned',
                snapshotSha256: canonicalNative,
                eventsSha256: nativeEvents,
                domainHashVersion: 1,
                domainHash,
                invariants: 'pass',
              },
              comparison: { snapshot: 'match', events: 'match', domainHash: 'match', invariants: 'match' },
            }],
            determinism: {
              typescriptRepeatSha256: tsRepeat,
              nativeRepeatSha256: nativeRepeat,
              typescriptRepeatMatch: true,
              nativeRepeatMatch: true,
            },
            correction: null,
            generatedAtCommit,
          };
          const dir = 'test-artifacts/cpp-parity/K003';
          mkdirSync(dir, { recursive: true });
          const path = `${dir}/invariant-runner-semantic-parity-tick-8.json`;
          writeFileSync(path, `${JSON.stringify(evidence, null, 2)}\n`, 'utf8');
          console.log(`K003 semantic snapshot SHA: ${canonicalTs}`);
          console.log(`K003 event/diagnostic SHA: ${tsEvents}`);
          console.log(`K003 generatedAtCommit: ${generatedAtCommit}`);
          NODE
          node --experimental-strip-types k003-evidence.mjs
          node /tmp/parity-evidence.mjs test-artifacts/cpp-parity/K003/invariant-runner-semantic-parity-tick-8.json

      - name: Upload K003 C005 parity evidence
        uses: actions/upload-artifact@v4
        with:
          name: k003-c005-parity-evidence
          path: test-artifacts/cpp-parity/K003/invariant-runner-semantic-parity-tick-8.json
          if-no-files-found: error

      - name: Commit verified K003 ledger and remove one-shot workflow
        shell: bash
        run: |
          rm -f k003-ts-evidence.ts k003-native-evidence.cpp k003-evidence.mjs
          rm -rf test-artifacts/cpp-parity/K003
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/k003-finalize.yml
          git add docs/cpp/TS_REWRITE_LEDGER.json
          git diff --cached --check
          git commit -m "docs(cpp): record K003 shadow parity"
          git push origin HEAD:feat/k003-invariant-runner-cpp-rewrite
