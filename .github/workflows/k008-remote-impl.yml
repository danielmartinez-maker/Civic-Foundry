name: K008 remote implementation

on:
  push:
    branches:
      - "feat/k008-system-scheduler-cpp-rewrite"

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Node 22
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
          cache: npm
      - name: Native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libjson-c-dev libgtest-dev
          python -m pip install --upgrade "cmake>=3.30,<5"
          cmake --version
          ninja --version
      - name: Add K008 tests first
        run: python scripts/cpp/k008_remote_impl.py tests
      - name: RED - prove new scheduler contracts fail first
        shell: bash
        run: |
          mkdir -p .k008-evidence
          set +e
          node scripts/cpp/run-native-round.mjs --regex "SchedulerContracts|SchedulerParity" > .k008-evidence/red.log 2>&1
          status=$?
          set -e
          cat .k008-evidence/red.log
          if [ "$status" -eq 0 ]; then
            echo "K008 RED gate unexpectedly passed" >&2
            exit 1
          fi
          grep -E "listSystemIds|has no member named|no member named" .k008-evidence/red.log
      - name: Apply minimal production changes
        run: python scripts/cpp/k008_remote_impl.py production
      - name: GREEN - focused scheduler gate run 1
        shell: bash
        run: |
          set -o pipefail
          node scripts/cpp/run-native-round.mjs --regex "SchedulerContracts|SchedulerParity" | tee .k008-evidence/green-1.log
      - name: GREEN - focused scheduler gate run 2
        shell: bash
        run: |
          set -o pipefail
          node scripts/cpp/run-native-round.mjs --regex "SchedulerContracts|SchedulerParity" | tee .k008-evidence/green-2.log
      - name: C004 full native gate
        shell: bash
        run: |
          set -o pipefail
          node scripts/cpp/run-native-round.mjs | tee .k008-evidence/native-full.log
      - name: C005 C006 and ledger control-plane gates
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run cpp:ts-ledger:verify
          npm run test:cpp-ts-count-guard
          npm run cpp:ts-count:guard
          npm run test:cpp-parity-evidence
          npm run test:cpp-authority-gate
          npm run cpp:authority:verify
      - name: Diff hygiene
        run: git diff --check
      - name: Preserve K008 evidence
        uses: actions/upload-artifact@v6.0.0
        with:
          name: k008-scheduler-tdd-evidence-${{ github.sha }}
          path: .k008-evidence/
          retention-days: 30
      - name: Commit implementation and remove temporary helpers
        run: |
          rm -rf .k008-evidence
          git rm .github/workflows/k008-remote-impl.yml scripts/cpp/k008_remote_impl.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cpp/engine/include/civic/core/Kernel.hpp cpp/engine/src/core/Kernel.cpp cpp/tests/core/CoreTests.cpp cpp/tests/parity/ParityTests.cpp docs/cpp/TS_REWRITE_LEDGER.json
          git status --short
          git commit -m "feat(k008): complete system scheduler C++ parity"
          git push origin HEAD:feat/k008-system-scheduler-cpp-rewrite
